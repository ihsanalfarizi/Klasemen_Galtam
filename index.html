<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Klasemen Galatama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --grid:#CFCFCF; --ink:#000; --muted:#4A4A4A;
  --sheet-bg:#F3F3F3; --cell-bg:#FFFFFF;
  --stripe:#DCEFE1;          /* baris selang-seling (mint) */
  --head-bg:#1E8E3E;         /* header hijau */
  --server-bg:#58B85F;       /* baris No 20 (server) */
  --green:#137E43; --red:#C0392B; --sel-border:#107C41; --title-bg:#FFFF00;
  --fs:16px;
  color-scheme:light;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;background:var(--sheet-bg);font-family:'Lexend','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:var(--ink);padding:24px 10px 60px;font-size:18px;font-weight:500;overflow-x:hidden;}
.wrap{width:1400px;margin:0 auto;}   /* lebar desain tetap; di-zoom otomatis oleh script supaya pas di layar apa pun */
.panel{background:var(--cell-bg);border:1px solid var(--grid);border-radius:4px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.table-scroll{min-width:0;}
table{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--cell-bg);font-size:var(--fs);}
col.col-rank{width:6%;} col.col-name{width:23%;} col.col-pay{width:7%;} col.col-nick{width:33%;} col.col-points{width:20%;} col.col-join{width:5%;} col.col-hist{width:5%;}

/* ===== Header ala Google Sheets ===== */
th.colhead{background:var(--head-bg);border:2px solid #000;font-weight:700;font-size:1em;color:#fff;text-align:center;padding:.7em 2px;letter-spacing:.3px;position:relative;}
th.filt::after{content:"";display:inline-block;width:.9em;height:.9em;margin-left:.45em;vertical-align:-.1em;opacity:.85;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M3 6h18M6 12h12M10 18h4' stroke='white' stroke-width='2.6' stroke-linecap='round' fill='none'/></svg>") center/contain no-repeat;}
thead th:nth-child(6), thead th:last-child{font-size:.55em;padding:1.1em 0;white-space:nowrap;overflow:hidden;}
thead th:nth-child(3){font-size:1.05em;font-weight:800;padding:.7em 0;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-shadow:0 1px 0 rgba(0,0,0,.35);}

/* ===== Isi tabel: baris putih & mint selang-seling ===== */
tbody td{border:2px solid #000;background:var(--cell-bg);vertical-align:middle;padding:0;font-size:1em;}
tbody tr:nth-child(even) td{background:var(--stripe);}
td.rank{text-align:center;font-weight:800;font-size:1.1em;}
td.center{text-align:center;padding-left:2px;padding-right:2px;}
td.poin-cell{text-align:center;padding:2px 1px;}

/* Baris Server / Admin (No 20) = hijau solid, tulisan tebal */
tbody tr.server td{background:var(--server-bg);font-weight:800;}
tbody tr.server td.rank,tbody tr.server input.team-name,tbody tr.server input.team-nick{font-weight:800;color:#0A2A14;}

/* Baris No 20 (Admin) bukan peserta: warna sendiri (abu-biru gelap), tidak ikut warna poin/juara */
tbody tr.server.server.server.server td{background:#FFCC80;color:#000;}
tbody tr.server.server.server.server td.rank,tbody tr.server.server input.team-name,tbody tr.server.server input.team-nick{color:#000;font-weight:800;}
tbody tr.server.server input.team-name::placeholder,tbody tr.server.server input.team-nick::placeholder{color:#000;}
tbody tr.server.server.server.server.search-hit td{background:#FFF176;}
tbody tr.server.server.search-hit input.team-name,tbody tr.server.server.search-hit input.team-nick,tbody tr.server.server.search-hit td.rank{color:var(--ink);}

/* ===== WARNA POIN =====
   Poin 0  = MERAH
   Poin > 0 = HIJAU
   (urutan CSS penting: aturan juara & poin-sama di bawah menimpa hijau) */
tbody tr.zero:not(.blank) td.name-cell,tbody tr.zero:not(.blank) td.poin-cell{background:#FFB0AA;}
tbody tr.pos td.name-cell,tbody tr.pos td.poin-cell{background:#6FD383;}

/* Juara 1-3 berurutan: EMAS, PERAK, PERUNGGU */
tbody tr.rank-1 td.name-cell,tbody tr.rank-1 td.poin-cell{background:#FFC400;}
tbody tr.rank-2 td.name-cell,tbody tr.rank-2 td.poin-cell{background:#B8C4CC;}
tbody tr.rank-3 td.name-cell,tbody tr.rank-3 td.poin-cell{background:#E58E3A;}
tbody tr[class*="rank-"] td.rank{font-weight:800;}

/* Poin sama di peringkat 1-10 = warna sama (tiap kelompok poin sama punya warna sendiri) */
tbody tr.tie-0 td.name-cell,tbody tr.tie-0 td.poin-cell{background:#B388FF;}   /* ungu */
tbody tr.tie-1 td.name-cell,tbody tr.tie-1 td.poin-cell{background:#26C6DA;}   /* cyan */
tbody tr.tie-2 td.name-cell,tbody tr.tie-2 td.poin-cell{background:#F06292;}   /* pink tua */
tbody tr.tie-3 td.name-cell,tbody tr.tie-3 td.poin-cell{background:#A1887F;}   /* coklat */
tbody tr.tie-4 td.name-cell,tbody tr.tie-4 td.poin-cell{background:#5C7CFA;}   /* biru tua */
tbody tr[class*="tie-"] td.rank{font-weight:800;}

/* Kedip saat poin berubah: hijau = naik, biru = turun */
@keyframes flashUp{0%,65%{background-color:#2ECC71;}}
@keyframes flashDown{0%,65%{background-color:#42A5F5;}}
tbody tr.flash-up td{animation:flashUp 2.4s ease-out;}
tbody tr.flash-down td{animation:flashDown 2.4s ease-out;}

/* Menu admin tersembunyi */
.copyright{user-select:none;-webkit-user-select:none;}
.adm-head{background:#263238;border-bottom:2px solid var(--grid);}
.adm-head .modal-title,.adm-head .modal-title small{color:#fff;}
.adm-total{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 6px;padding:14px 18px;background:#E6F5EC;border:2px solid var(--green);border-radius:6px;}
.adm-total span{font-weight:700;font-size:22px;}
.adm-total b{font-weight:800;font-size:44px;color:#0B4A28;line-height:1;}
.adm-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid #E1E1E1;font-size:20px;}
.adm-row:last-child{border-bottom:none;}
.adm-row .adm-name{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.adm-row .adm-nums{color:var(--muted);font-weight:500;font-size:18px;white-space:nowrap;}
.adm-row .adm-sub{min-width:56px;text-align:right;font-weight:800;font-size:24px;}
.adm-row.none .adm-sub,.adm-row.none .adm-nums{color:#9A9A9A;}
.adm-hint{text-align:center;color:var(--muted);font-size:16px;padding:10px 0 0;}

/* Input nama */
input.team-name,input.team-nick{width:100%;border:none;background:transparent;font-family:inherit;font-weight:700;font-size:1.08em;color:var(--ink);padding:.75em .3em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
input.team-name{text-transform:none;}
input.team-name::placeholder,input.team-nick::placeholder{color:var(--muted);opacity:.6;font-weight:400;text-transform:none;}
input.team-name:focus,input.team-nick:focus{outline:none;background:#fff;box-shadow:inset 0 0 0 2px var(--sel-border);text-align:left;}

.points-wrap{display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:nowrap;}
input.points{width:1.9em;min-width:0;border:2px solid rgba(0,0,0,.6);border-radius:6px;background:#fff;font-family:inherit;font-weight:800;font-size:1.2em;color:var(--ink);text-align:center;padding:0 .2em;line-height:1.3;height:1.3em;flex:none;cursor:default;margin-right:.35em;overflow:visible;-webkit-appearance:none;appearance:none;-webkit-text-fill-color:currentColor;opacity:1;}
input.points:focus{outline:none;}
input.points-add{width:3em;min-width:3em;flex:none;border:1px dashed #9A9A9A;background:rgba(255,255,255,.75);font-family:inherit;font-weight:500;font-size:.8em;color:var(--muted);text-align:center;padding:.55em 0;border-radius:2px;}
.points-wrap>*{flex-shrink:0;}
/* Angka POINT diperbesar, ikon poin ikan & kolom ± dikecilkan agar tetap muat */
input.points{width:1.8em;font-size:1.6em;height:1.25em;line-height:1.2;padding:0 .1em;margin-right:.3em;}
input.points-add{width:2.6em;min-width:2.6em;}
.fish-btn{height:1.7em;padding:0 .15em;}
.fish-btn img{height:1.3em;}
input.points-add::placeholder{color:#8A8A8A;}
input.points-add:focus{outline:none;border-color:var(--green);border-style:solid;color:var(--ink);background:#fff;}
.add-btn{width:1.15em;min-width:1.15em;height:1.5em;flex:none;border-radius:2px;border:1px solid var(--green);background:rgba(255,255,255,.75);color:var(--green);font-family:inherit;font-weight:700;font-size:1em;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.add-btn:hover{background:#fff;} .add-btn:active{transform:scale(.9);}

/* Tombol pilih jenis ikan */
.fish-btn{font-size:1em;height:2.1em;flex:none;border-radius:4px;border:2px solid #1565C0;background:#E3F2FD;cursor:pointer;padding:0 .2em;display:flex;align-items:center;justify-content:center;gap:.1em;font-family:inherit;white-space:nowrap;}
.fish-btn img{height:1.7em;width:auto;display:block;pointer-events:none;}
.fish-btn:hover{background:#BBDEFB;border-color:#0D47A1;}
.fish-btn:active{transform:scale(.93);}
.fish-opt{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:2px solid #E1E1E1;font-size:24px;font-weight:700;cursor:pointer;}
.fish-opt input{width:30px;height:30px;accent-color:var(--green);}
.fish-opt .fp{margin-left:auto;color:var(--green);font-weight:800;}
.fish-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-top:2px solid var(--grid);}
.fish-foot b{font-size:30px;color:#0B4A28;}
.fish-ok{background:var(--green);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:24px;font-weight:700;padding:12px 28px;cursor:pointer;}
.hist-fish{display:block;font-size:20px;font-weight:600;color:#E65100;}

/* Kolom Pay: isi dulu, KLIK 1x = tandai sudah bayar (hijau), klik lagi = batal, klik 2x = edit
   Tulisan dibesarkan (1.4em); lebar kolom tetap. Tulisan panjang mengecil otomatis lewat fitPay() */
input.pay-input{width:100%;min-width:0;border-radius:8px;font-family:inherit;font-size:1.15em;font-weight:800;text-align:center;padding:.3em 0;text-transform:uppercase;transition:background .15s,border-color .15s,color .15s,box-shadow .15s;background:#FFE9E7;border:2px solid #E5484D;color:#C62828;box-shadow:none;}
input.pay-input::placeholder{color:#C98A84;font-weight:600;text-transform:none;}
input.pay-input:focus{outline:none;box-shadow:0 0 0 2px rgba(16,124,65,.35);}
input.pay-input.locked{cursor:pointer;caret-color:transparent;}
input.pay-input.done{background:#1FA35C;border-color:#137E43;color:#fff;box-shadow:0 2px 6px rgba(19,126,67,.45);}

/* Checklist absen */
.join-btn{width:1.3em;height:1.5em;max-width:100%;border-radius:3px;cursor:pointer;font-size:1em;font-weight:800;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;font-family:inherit;transition:background .12s,border-color .12s,color .12s,transform .08s;user-select:none;background:#fff;border:2px solid #444;color:transparent;}
.join-btn:active{transform:scale(.9);}
.join-btn:hover{border-color:#137E43;}
.join-btn.joined{background:#1FA35C;border-color:#137E43;color:#fff;}

.hist-btn{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;max-width:100%;border-radius:2px;border:1px solid var(--grid);background:#fff;color:var(--muted);font-size:1em;cursor:pointer;position:relative;transition:border-color .12s;}
.hist-btn:hover{border-color:var(--sel-border);} .hist-btn:active{transform:scale(.92);}
/* Absen & History: isi dibuat penuh selebar kolom supaya jelas terlihat */
td.center .join-btn{width:100%;height:2.1em;font-size:1.3em;border-radius:4px;}
td.center .hist-btn{width:100%;height:2.1em;border-radius:4px;}
td.center .hist-btn .ico{width:1.4em;height:1.4em;}
.hist-btn .hist-count{position:absolute;top:-.4em;right:-.4em;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--red);color:#fff;font-size:max(9px,.5em);font-weight:600;display:flex;align-items:center;justify-content:center;line-height:1;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal-box{width:100%;max-width:680px;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;background:#fff;border:2px solid var(--grid);border-radius:8px;box-shadow:0 16px 48px rgba(0,0,0,.35);overflow:hidden;}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;background:var(--head-bg);color:#fff;border-bottom:2px solid var(--grid);}
.modal-title{font-weight:700;font-size:28px;}
.modal-title small{display:block;font-weight:500;font-size:20px;opacity:.9;margin-top:4px;}
.modal-close{width:48px;height:48px;border-radius:4px;border:2px solid var(--grid);background:#fff;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;flex:none;}
.modal-close:hover{border-color:var(--red);color:var(--red);}
.modal-body{overflow-y:auto;padding:10px 22px 22px;}
.hist-empty{text-align:center;color:var(--muted);font-size:22px;padding:40px 10px;}
.hist-list{list-style:none;margin:0;padding:0;}
.hist-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:2px solid #E1E1E1;}
.hist-item:last-child{border-bottom:none;}
.hist-delta{font-weight:800;font-size:36px;min-width:100px;}
.hist-delta.pos{color:var(--green);} .hist-delta.neg{color:var(--red);}
.hist-meta{flex:1;text-align:right;}
.hist-time{font-size:22px;font-weight:500;color:var(--muted);display:block;}
.hist-after{font-size:24px;font-weight:700;display:block;margin-bottom:2px;}
@media (max-width:520px){.modal-title{font-size:22px;}.modal-title small{font-size:16px;}.hist-delta{font-size:28px;min-width:76px;}.hist-after{font-size:19px;}.hist-time{font-size:16px;}.hist-fish{font-size:15px;}.fish-opt{font-size:20px;}}

.top-row{display:flex;align-items:stretch;gap:10px;margin:0 0 10px;}
.top-row .search-bar{flex:1;min-width:0;margin:0;}
.search-bar{display:flex;align-items:center;gap:6px;margin:0 0 8px;padding:3px 12px;background:#fff;border:2px solid var(--head-bg);border-radius:6px;}
.search-bar:focus-within{border-color:var(--sel-border);}
.search-bar.active{border-color:#107C41;background:#E2EFDA;}
.search-icon{font-size:calc(var(--fs)*1.15);flex:none;display:flex;}
#searchInput{flex:1;min-width:0;border:none;background:transparent;font-family:inherit;font-weight:500;font-size:calc(var(--fs)*1.1);color:var(--ink);padding:.3em 4px;}
#searchInput:focus{outline:none;}
.search-key{flex:none;font-size:calc(var(--fs)*.75);font-weight:600;color:var(--muted);border:1px solid var(--grid);border-radius:3px;padding:.1em .45em;background:#F3F3F3;white-space:nowrap;}
#searchClear{display:none;flex:none;width:1.5em;height:1.5em;border-radius:3px;border:1px solid var(--grid);background:#fff;color:var(--muted);font-size:calc(var(--fs)*.85);cursor:pointer;line-height:1;}
#searchClear:hover{border-color:var(--red);color:var(--red);}
#searchCount{display:none;flex:none;font-weight:600;font-size:calc(var(--fs)*.8);padding:.15em .6em;border-radius:999px;color:#fff;background:var(--green);white-space:nowrap;}
#searchCount.none{background:var(--red);}
body.searching tbody tr{opacity:.3;transition:opacity .15s;}
body.searching tbody tr.search-hit{opacity:1;}
tbody tr.search-hit td,tbody tr.search-hit td.name-cell,tbody tr.search-hit td.poin-cell{background:#FFF176;box-shadow:inset 0 4px 0 #E65100,inset 0 -4px 0 #E65100;}
tbody tr.search-hit td:first-child{box-shadow:inset 4px 0 0 #E65100,inset 0 4px 0 #E65100,inset 0 -4px 0 #E65100;}
tbody tr.search-hit td:last-child{box-shadow:inset -4px 0 0 #E65100,inset 0 4px 0 #E65100,inset 0 -4px 0 #E65100;}

/* Sisa Slot */
.slot-badge{flex:none;display:inline-flex;align-items:center;align-self:center;gap:.4em;font-weight:700;font-size:calc(var(--fs)*.92);white-space:nowrap;padding:.2em .3em .2em .7em;border-radius:999px;background:var(--stripe);border:2px solid var(--head-bg);color:var(--ink);}
.slot-badge .slot-num{display:inline-block;min-width:1.8em;padding:.05em .5em;border-radius:999px;background:var(--green);color:#fff;text-align:center;font-weight:800;font-size:1.4em;line-height:1.3;}
.slot-badge.full .slot-num{background:var(--red);}
.plus-set input{width:3em;border:2px solid var(--head-bg);border-radius:6px;background:#fff;font-family:inherit;font-weight:800;font-size:1.2em;text-align:center;color:var(--ink);padding:.05em .1em;}
.usn-set input{width:5.2em;font-size:1em;font-weight:700;padding:.2em .4em;}
.usn-set input::placeholder{color:#8A8A8A;font-weight:500;}
.plus-set input:focus{outline:none;border-color:var(--sel-border);}
.slot-badge.start-set{font-size:calc(var(--fs)*.92);gap:.4em;padding:.2em .3em .2em .7em;}
.usn-set.start-set input{width:5.6em;font-size:1em;font-weight:700;font-family:inherit;padding:.2em .3em;cursor:pointer;}
.usn-set.start-set input::-webkit-calendar-picker-indicator{display:none;}
.map-set input{text-transform:uppercase;}
.map-set input::placeholder{text-transform:none;}
.map-clear{flex:none;width:1.6em;height:1.6em;border-radius:50%;border:1px solid var(--grid);background:#fff;color:var(--muted);font-size:.9em;cursor:pointer;line-height:1;padding:0;display:none;}
.map-clear:hover{border-color:var(--red);color:var(--red);}

.medal{display:inline-flex;align-items:center;justify-content:center;width:1.7em;height:1.7em;border-radius:50%;font-weight:800;font-size:.95em;color:#222;border:2px solid rgba(0,0,0,.35);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);}
.medal.m1{background:linear-gradient(#FFE27A,#F5B700);}
.medal.m2{background:linear-gradient(#F4F6F8,#AEB8C2);}
.medal.m3{background:linear-gradient(#F0B27A,#B8691F);color:#fff;}
.ico{width:1.05em;height:1.05em;display:block;}
.copyright{margin-top:14px;text-align:center;font-weight:800;font-size:calc(var(--fs)*.9);color:#D32F2F;letter-spacing:.3px;}
.adm-trigger{cursor:pointer;}

/* ===== Popup Tarik Ikan: lebih kecil & centang di kanan ===== */
#fishModal .modal-box{max-width:460px;}
#fishModal .modal-head{padding:12px 18px;}
#fishModal .modal-title{font-size:23px;}
#fishModal .modal-title small{font-size:16px;margin-top:3px;}
#fishModal .modal-close{width:38px;height:38px;font-size:20px;}
#fishModal .modal-body{padding:4px 18px 8px;}
#fishModal .fish-opt{font-size:20px;gap:10px;padding:9px 0;}
#fishModal .fish-opt .fp{margin-left:auto;order:2;font-size:19px;}
#fishModal .fish-opt input{order:3;width:27px;height:27px;margin:0 0 0 12px;}
#fishModal .fish-foot{padding:10px 18px;}
#fishModal .fish-foot b{font-size:25px;}
#fishModal .fish-ok{font-size:20px;padding:10px 24px;}

/* ===== Bar atas: 2 baris & diperbesar ===== */
.top-row{flex-wrap:wrap;gap:5px 8px;margin:0 0 5px;}

/* Baris 1: kolom cari memanjang penuh */
.top-row .search-bar{flex:1 1 100%;padding:0 10px;}
.search-icon{font-size:calc(var(--fs)*1.9);}
#searchInput{font-size:calc(var(--fs)*.85);padding:.15em 4px;}
.search-key{font-size:calc(var(--fs)*.65);}
#searchCount{font-size:calc(var(--fs)*.7);}
#searchClear{font-size:calc(var(--fs)*.75);}

/* Baris 2: POINT BIN, ADD USN, MAP, JAM START, Sisa Slot */
.top-row .slot-badge{font-size:calc(var(--fs)*1.25);padding:.3em .4em .3em .8em;gap:.5em;}
.top-row .slot-badge.plus-set{flex:0 0 auto;}
/* ADD USN & MAP: ikut melebar mengikuti panjang tulisan (lebar diatur script autoGrow) */
.top-row .slot-badge.usn-set:not(.start-set){flex:1 1 auto;min-width:0;}
.top-row .slot-badge.plus-set input{flex:0 1 auto;min-width:0;font-size:1em !important;padding:.3em .4em;}
.top-row .slot-badge.usn-set:not(.start-set) input{flex:1 1 auto;}
/* POINT BIN & JAM START: kolom isian diperkecil */
#plusDefault{width:1.9em !important;flex:none !important;padding:.3em .1em !important;}
#jamStart{width:3.7em !important;flex:none !important;padding:.3em .1em !important;font-size:.9em !important;}
.top-row .slot-badge .slot-num{font-size:1.5em;}
#slotInfo{flex:0 0 auto;}

/* Footer "Created By": jarak atas tipis, tulisan diperbesar */
.copyright{margin-top:2px;font-size:calc(var(--fs)*1.6);line-height:1.2;}

/* Tombol ✕ di kolom MAP dihapus (disembunyikan) */
.map-clear{display:none !important;}

/* Baris badge: selalu sejajar 1 baris, USN & MAP mengecil kalau tidak muat */
.badge-row{display:flex;flex:1 1 100%;flex-wrap:wrap;align-items:center;gap:8px 10px;min-width:0;}
.badge-row .slot-badge{min-width:min-content;flex-shrink:0;}
.badge-row .slot-badge.plus-set:not(.usn-set),.badge-row .start-set,.badge-row #slotInfo{flex:0 0 auto;}
/* USN & MAP: melebar mengikuti isi (lebar input diatur script), tidak pernah terpotong */
.badge-row .slot-badge.usn-set:not(.start-set){flex:1 0 auto;}
.badge-row .slot-badge.usn-set:not(.start-set) input{flex:1 0 auto;}
.top-row .badge-row .slot-badge{font-size:calc(var(--fs)*1.75);}
.top-row .badge-row .slot-badge > span:first-child{font-size:.62em;}
.top-row .badge-row .slot-badge{gap:.15em;}
.top-row .badge-row #slotInfo > .slot-label{font-size:1.6em;line-height:1;font-weight:800;margin-right:0;}
.top-row .badge-row #slotInfo{gap:.2em;padding-left:.5em;}

/* ===== Search paling atas: tanpa jarak ===== */
body{padding-top:0;}
.panel{padding-top:6px;border-top:none;border-radius:0 0 4px 4px;}
.top-row{margin-top:0;}
.top-row .search-bar{margin-top:0;border-top-width:2px;}

/* ===== SEARCH MENGAMBANG di kanan atas: muncul saat Ctrl+F, hilang saat Esc / kosong ===== */
.top-row .search-bar{position:fixed;top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:auto;left:50%;transform:translateX(-50%);width:760px;max-width:calc(100vw - 28px);flex:none;margin:0;padding:16px 24px;gap:16px;background:#2b2b2d;border:0;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:90;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .12s;}
body.search-open .top-row .search-bar{visibility:visible;opacity:1;pointer-events:auto;}
.top-row .search-bar.active{background:#2b2b2d;border:0;}
.top-row #searchInput{font-size:calc(var(--fs)*2.1);color:#fff;padding:.3em 6px;}
#searchInput::placeholder{color:#8e8e93;opacity:1;}
.top-row #searchCount{background:transparent;color:#c8c8cc;font-size:calc(var(--fs)*1.3);padding:0;}
.top-row #searchCount.none{background:transparent;color:#ff8a80;}
.search-nav,.top-row #searchClear{flex:none;display:flex;align-items:center;justify-content:center;width:2.4em;height:2.4em;border:0;background:transparent;color:#c8c8cc;border-radius:6px;padding:0;cursor:pointer;font-family:inherit;}
.top-row #searchClear{display:flex !important;font-size:calc(var(--fs)*1.6);}
.search-nav:hover,.top-row #searchClear:hover{background:#3a3a3c;color:#fff;}
.search-nav svg{width:1.1em;height:1.1em;}
#searchFab{position:fixed;top:auto;bottom:calc(6px + env(safe-area-inset-bottom,0px));right:auto;left:50%;transform:translateX(-50%);width:3.2em;height:3.2em;border-radius:50%;border:0;background:#2b2b2d;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.85;z-index:89;padding:0;font-size:var(--fs);box-shadow:0 4px 12px rgba(0,0,0,.3);transition:opacity .15s;}
#searchFab:hover{opacity:1;}
#searchFab svg{width:1.2em;height:1.2em;}
body.search-open #searchFab{display:none;}
tbody tr.search-hit.search-cur td,tbody tr.search-hit.search-cur td.name-cell,tbody tr.search-hit.search-cur td.poin-cell{background:#FFC107;}

/* ===== TANDA MERAH: klik kolom NO untuk mewarnai baris merah / membatalkan ===== */
td.rank.red-toggle{cursor:pointer;user-select:none;-webkit-user-select:none;}
tbody tr.red td,
tbody tr.red td.name-cell,
tbody tr.red td.poin-cell{background:#E53935;color:#fff;}
tbody tr.red input.team-name,
tbody tr.red input.team-nick{color:#fff;}
tbody tr.red input.team-name::placeholder,
tbody tr.red input.team-nick::placeholder{color:#FFCDD2;}
tbody tr.red input.team-name:focus,
tbody tr.red input.team-nick:focus{background:#fff;color:#000;}
tbody tr.red.search-hit td,
tbody tr.red.search-hit td.name-cell,
tbody tr.red.search-hit td.poin-cell{background:#FF8A80;}
tbody tr.red.search-hit input.team-name,
tbody tr.red.search-hit input.team-nick{color:#000;}
.red-note{display:inline-block;margin-left:1.2em;font-size:.55em;font-weight:600;color:#5D4037;letter-spacing:0;vertical-align:middle;background:#FFF59D;border:2px solid #F9A825;border-left:6px solid #F9A825;border-radius:4px;padding:.3em .8em;box-shadow:0 2px 4px rgba(0,0,0,.15);}
.red-note b{color:#D32F2F;font-weight:800;margin-right:.3em;}

/* Kolom ±: panah naik/turun selalu tampil, angka lebih jelas */
input.points-add{width:3em;min-width:3em;font-size:.95em;font-weight:800;color:var(--ink);padding:.2em 0 .2em .3em;text-align:center;border:1px solid #9A9A9A;background:#fff;-moz-appearance:number-input;}
input.points-add::-webkit-inner-spin-button,
input.points-add::-webkit-outer-spin-button{-webkit-appearance:inner-spin-button;opacity:1;height:1.5em;margin-left:1px;cursor:pointer;}

/* Tulisan Admin (baris No 20) = hitam */
tbody tr.server input.team-name,
tbody tr.server input.team-nick,
tbody tr.server.server.server input.team-name,
tbody tr.server.server.server input.team-nick{color:#000 !important;-webkit-text-fill-color:#000;}

/* Perkecil isi kolom POINT supaya tidak luber ke kolom Absen */
.points-wrap{gap:1px;max-width:100%;overflow:hidden;}
input.points{width:1.6em;font-size:1.85em;height:1.2em;margin-right:.15em;}
input.points-add{width:2.55em;min-width:2.55em;font-size:.8em;padding:.1em 0 .1em .1em;text-align:center;}
.add-btn{width:1em;min-width:1em;height:1.3em;font-size:.9em;}
.fish-btn{height:1.4em;padding:0 .1em;border-width:1px;}
.fish-btn img{height:1.05em;}

/* ===== Footer di dalam panel (tepat di bawah tabel) ===== */
.panel .copyright{margin-top:5px;padding-top:3px;line-height:1.15;}
.panel{border-radius:4px;padding-bottom:7px;}
.copy-mark{display:inline-block;margin-right:.08em;font-weight:800;}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="top-row">
    <div class="search-bar">
      <span class="search-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#B0B0B0" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></span>
      <input type="text" id="searchInput" placeholder="Find..." autocomplete="off">
      <span id="searchCount"></span>
      <button type="button" class="search-nav" id="searchPrev" title="Sebelumnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      <button type="button" class="search-nav" id="searchNext" title="Berikutnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <button type="button" id="searchClear" title="Tutup (Esc)">✕</button>
    </div>
    <div class="badge-row">
    <div class="slot-badge plus-set" title="Nilai poin awal otomatis untuk peserta yang kolom Pay-nya berisi BIN, juga nilai bawaan tombol + (kolom ± kosong)"><span>+ POINT BIN</span><input type="number" id="plusDefault" value="0" step="1"></div>
    <div class="slot-badge plus-set usn-set" title="Kolom ADD USN, diisi manual"><span>USN</span><input type="text" id="addUsn" placeholder="isi USN..." autocomplete="off" spellcheck="false"></div>
    <div class="slot-badge plus-set usn-set map-set" title="Kolom MAP: klik untuk pilih dari daftar, atau ketik sendiri"><span>MAP</span><input type="text" id="addMap" list="mapList" placeholder="pilih map..." autocomplete="off" spellcheck="false"><button type="button" class="map-clear" id="mapClear" title="Kosongkan MAP">✕</button></div>
    <div class="slot-badge plus-set usn-set start-set" title="Jam start lomba: klik untuk pilih jam"><span>START</span><input type="time" id="jamStart"></div>
    <datalist id="mapList"></datalist>
    <div class="slot-badge" id="slotInfo" title="Jumlah Nama Peserta yang masih kosong"><span class="slot-label">-</span><span class="slot-num" id="slotLeft">0</span></div>
    </div>
    </div>
    <div class="tables">
      <div class="table-scroll"><table>
        <colgroup><col class="col-rank"><col class="col-name"><col class="col-pay"><col class="col-nick"><col class="col-points"><col class="col-join"><col class="col-hist"></colgroup>
        <thead><tr><th class="colhead">NO</th><th class="colhead">NAMA</th><th class="colhead">Pay</th><th class="colhead ">DISPLAY NAMA</th><th class="colhead ">POINT</th><th class="colhead">Absen</th><th class="colhead">History</th></tr></thead>
        <tbody id="tableBodyTop"></tbody>
      </table></div>
      <div class="table-scroll"><table>
        <colgroup><col class="col-rank"><col class="col-name"><col class="col-pay"><col class="col-nick"><col class="col-points"><col class="col-join"><col class="col-hist"></colgroup>
        <thead><tr><th class="colhead">NO</th><th class="colhead ">NAMA</th><th class="colhead">Pay</th><th class="colhead ">DISPLAY NAMA</th><th class="colhead ">POINT</th><th class="colhead">Absen</th><th class="colhead">History</th></tr></thead>
        <tbody id="tableBodyBottom"></tbody>
      </table></div>
    </div>
    <div class="copyright"><span class="copy-mark" title="Copyright">&copy;</span><span class="adm-trigger" id="admTrigger">Created</span> By Aaronnn<span class="red-note"><b>NOTE:</b> Klik no peserta untuk memerahkan display &nbsp;|&nbsp; Klik Pay yang sudah diisi untuk menandakan sudah dibayar</span></div>
  </div>
</div>

<button type="button" id="searchFab" title="Cari (Ctrl+F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>

<div class="modal-overlay" id="histModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="histModalTitle">History<small id="histModalSub"></small></div>
      <button type="button" class="modal-close" id="histModalClose">✕</button>
    </div>
    <div class="modal-body" id="histModalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="admModal">
  <div class="modal-box">
    <div class="modal-head adm-head">
      <div class="modal-title">Menu Admin<small>Total angka di kolom Pay</small></div>
      <button type="button" class="modal-close" id="admModalClose">✕</button>
    </div>
    <div class="modal-body" id="admModalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="fishModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">Tarik Ikan<small id="fishSub"></small></div>
      <button type="button" class="modal-close" id="fishClose">✕</button>
    </div>
    <div class="modal-body" id="fishList"></div>
    <div class="fish-foot"><span>Total: <b id="fishTotal">+0</b></span><button type="button" class="fish-ok" id="fishOk">Tambah</button></div>
  </div>
</div>

<script>
  const namaPeserta = ["","","","","","","","","","","","","","","","","","","","Admin"];
  const nicknamePeserta = ["","","","","","","","","","","","","","","","","","","","Admin"];
  const defaultTeams = [];
  for(let i=1;i<=20;i++){
    // red = true -> baris diwarnai merah (hanya warna, tidak mengubah poin/peringkat)
    defaultTeams.push({ id:i, name:namaPeserta[i-1], nickname:nicknamePeserta[i-1], points:0, binGiven:0, pay:'', paid:false, joined:false, red:false, slotTime:0, history:[], flash:null });
  }
  // No 20 (Admin): otomatis sudah absen dan Pay = D (hijau)
  const adminTeam = defaultTeams.find(t => t.id === 20);
  adminTeam.joined = true;
  adminTeam.pay = 'D';
  adminTeam.paid = true;
  let teams = JSON.parse(JSON.stringify(defaultTeams));

  // Gambar ikan (SVG tertanam, tidak perlu file luar). Untuk pakai gambar sendiri,
  // ganti isi FISH_IMG dengan data URI / nama file gambar, mis. 'ikan.png'
  const FISH_SVG =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
    '<circle cx="28" cy="36" r="26" fill="#FFB300" stroke="#6D4000" stroke-width="4"/>' +
    '<circle cx="28" cy="36" r="19" fill="#FFD54F" stroke="#6D4000" stroke-width="2.5"/>' +
    '<path fill-rule="evenodd" fill="#6D4000" d="M20 22h13a9 9 0 0 1 0 18h-6v10h-7zM27 28v6h6a3 3 0 0 0 0-6z"/>' +
    '<circle cx="50" cy="14" r="13" fill="#2E7D32" stroke="#fff" stroke-width="3"/>' +
    '<path d="M50 7 V21 M43 14 H57" stroke="#fff" stroke-width="5" stroke-linecap="round"/>' +
    '</svg>';
  const FISH_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(FISH_SVG);

  const tbodyTop = document.getElementById('tableBodyTop');
  const tbodyBottom = document.getElementById('tableBodyBottom');
  const histModal = document.getElementById('histModal');
  const histModalBody = document.getElementById('histModalBody');
  const histModalTitle = document.getElementById('histModalTitle');
  const histModalSub = document.getElementById('histModalSub');
  const histModalClose = document.getElementById('histModalClose');
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');

  // Nilai tombol + (diatur di bagian atas, default 1 kalau kosong/0)
  const plusDefaultInput = document.getElementById('plusDefault');
function getPlusDefault() {
  return 1;
}
  // Bonus otomatis untuk Tarik Ikan (0 kalau kosong)
  // Bonus POINT BIN diberikan SEKALI di awal: begitu kolom Pay berisi "bin" (huruf besar/kecil bebas),
  // poin peserta otomatis bertambah sebesar nilai + POINT BIN. Kalau "bin" dihapus dari Pay, bonus ditarik lagi.
  function syncBin(t){
    const has = /bin/i.test(t.pay || '');
    let delta = 0, label = '';
    if(has && !t.binGiven){
      const amt = parseInt(plusDefaultInput.value, 10) || 0;
      if(!amt) return false;
      t.binGiven = amt; delta = amt; label = 'Bonus Bin';
    } else if(!has && t.binGiven){
      delta = -t.binGiven; t.binGiven = 0; label = 'Bin dibatalkan';
    } else return false;
    const newPoints = Math.max(0, t.points + delta);
    const actual = newPoints - t.points;
    t.points = newPoints;
    if(actual){
      t.flash = { dir: actual > 0 ? 'up' : 'down', time: Date.now() };
      t.history.push({ delta: actual, after: newPoints, time: Date.now(), label });
    }
    return true;
  }

  // Lama kedip warna saat poin berubah (ms) - samakan dengan durasi animasi di CSS
  const FLASH_MS = 2400;

  // Sisa slot = jumlah Nama Peserta yang masih kosong
  function updateSlotInfo(){
    const left = teams.filter(t => (t.name || '').trim() === '').length;
    document.getElementById('slotLeft').textContent = left;
    document.getElementById('slotInfo').classList.toggle('full', left === 0);
  }

  let searchIdx = 0;
  function markCur(scroll){
    const hits = [...document.querySelectorAll('tr.search-hit')];
    document.querySelectorAll('tr.search-cur').forEach(r => r.classList.remove('search-cur'));
    if(!hits.length) return;
    searchIdx = ((searchIdx % hits.length) + hits.length) % hits.length;
    const cur = hits[searchIdx];
    cur.classList.add('search-cur');
    if(scroll) cur.scrollIntoView({ block:'center', behavior:'smooth' });
  }
  function stepSearch(d){ searchIdx += d; markCur(true); }
  function applySearch(scroll){
    const q = searchInput.value.trim().toLowerCase();
    searchClear.style.display = q ? 'block' : 'none';
    let first = null, count = 0;
    document.querySelectorAll('#tableBodyTop tr, #tableBodyBottom tr').forEach(tr => {
      const t = teams.find(x => x.id === Number(tr.dataset.id));
      const hit = !!q && !!t && (t.nickname || '').toLowerCase().includes(q);
      tr.classList.toggle('search-hit', hit);
      if(hit){ count++; if(!first) first = tr; }
    });
    document.body.classList.toggle('searching', !!q);
    document.querySelector('.search-bar').classList.toggle('active', !!q);
    const cnt = document.getElementById('searchCount');
    cnt.style.display = q ? 'inline-block' : 'none';
    cnt.classList.toggle('none', !!q && count === 0);
    cnt.textContent = count ? (count + ' ditemukan') : 'Tidak ditemukan';
    markCur(!!scroll);
  }

  // ===== Search tersembunyi: hanya muncul lewat Ctrl+F =====
  function openSearch(){
    document.body.classList.add('search-open');
    searchInput.focus({ preventScroll:true });
    searchInput.select();
  }
  function closeSearch(){
    searchInput.value = '';
    applySearch();
    document.body.classList.remove('search-open');
    searchInput.blur();
  }
  searchInput.addEventListener('input', () => { searchIdx = 0; applySearch(true); });
  searchInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      // Enter = langsung buka popup "Tarik Ikan" untuk peserta pertama yang ditemukan
      const hit = document.querySelector('tr.search-cur') || document.querySelector('tr.search-hit');
      if(hit) openFish(Number(hit.dataset.id));
    } else if(e.key === 'Escape'){
      closeSearch();
    }
  });
  // Kalau kolom search kosong lalu kehilangan fokus, sembunyikan lagi
  searchInput.addEventListener('blur', () => {
    setTimeout(() => {
      if(searchInput.value.trim() === '' && document.activeElement !== searchInput && !fishModal.classList.contains('open')){
        document.body.classList.remove('search-open');
      }
    }, 150);
  });
  searchClear.addEventListener('mousedown', (e) => e.preventDefault());
  searchClear.addEventListener('click', () => closeSearch());
  // Tombol kecil kanan atas = cadangan kalau Ctrl+F ditangkap browser (mis. fokus belum di halaman)
  document.getElementById('searchFab').addEventListener('click', openSearch);
  // Pastikan halaman memegang fokus keyboard supaya Ctrl+F sampai ke halaman, bukan ke browser
  window.focus();
  document.addEventListener('pointerdown', () => window.focus(), { once:true });
  ['searchPrev','searchNext'].forEach(id => {
    const b = document.getElementById(id);
    b.addEventListener('mousedown', (e) => e.preventDefault());
    b.addEventListener('click', () => stepSearch(id === 'searchNext' ? 1 : -1));
  });

  // Pintasan Ctrl+F (atau Cmd+F di Mac): munculkan kolom search lalu langsung fokus
  document.addEventListener('keydown', (e) => {
    if((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'f'){
      e.preventDefault();
      if(histModal.classList.contains('open')) closeHistory();
      openSearch();
    }
  });

  // ===== Menu admin tersembunyi =====
  // Buka: HANYA dengan klik kata "Copyright" (bukan seluruh baris) di bawah (tidak ada pintasan keyboard).
  // Total dihitung dari angka di kolom PAY (bukan Nama Peserta).
  const admModal = document.getElementById('admModal');
  const admModalBody = document.getElementById('admModalBody');

  function openAdmin(){
    admModalBody.innerHTML = '';

    let grand = 0, paidTotal = 0, filled = 0, withNum = 0;
    const rows = document.createElement('div');
    getSorted().forEach(t => {
      const pay = (t.pay || '').trim();
      if(!pay) return;                       // lewati yang kolom Pay-nya kosong
      filled++;
      const nums = (pay.match(/\d+/g) || []).map(Number);
      const sub = nums.reduce((a, b) => a + b, 0);
      if(nums.length) withNum++;
      grand += sub;
      if(t.paid) paidTotal += sub;
      const label = (t.name || '').trim() || (t.nickname || '').trim() || ('Peserta #' + t.id);
      const row = document.createElement('div');
      row.className = 'adm-row' + (nums.length ? '' : ' none');
      const n = document.createElement('span'); n.className = 'adm-name'; n.textContent = label + (t.paid ? ' ✓' : '');
      const ns = document.createElement('span'); ns.className = 'adm-nums'; ns.textContent = 'Pay: ' + pay;
      const sb = document.createElement('span'); sb.className = 'adm-sub'; sb.textContent = nums.length ? sub : '-';
      if(t.paid) sb.style.color = 'var(--green)';
      row.append(n, ns, sb);
      rows.appendChild(row);
    });
    const total = document.createElement('div');
    total.className = 'adm-total';
    total.innerHTML = '<span>TOTAL PAY</span><b></b>';
    total.querySelector('b').textContent = grand;
    admModalBody.appendChild(total);

    const paidBox = document.createElement('div');
    paidBox.className = 'adm-total';
    paidBox.innerHTML = '<span>SUDAH BAYAR (hijau)</span><b></b>';
    paidBox.querySelector('b').textContent = paidTotal;
    admModalBody.appendChild(paidBox);

    if(filled){
      admModalBody.appendChild(rows);
      const hint = document.createElement('div');
      hint.className = 'adm-hint';
      hint.textContent = withNum + ' dari ' + filled + ' peserta punya angka di kolom Pay';
      admModalBody.appendChild(hint);
    } else {
      const e = document.createElement('div');
      e.className = 'hist-empty'; e.textContent = 'Belum ada kolom Pay yang terisi.';
      admModalBody.appendChild(e);
    }
    admModal.classList.add('open');
  }
  function closeAdmin(){ admModal.classList.remove('open'); }
  document.getElementById('admModalClose').addEventListener('click', closeAdmin);
  admModal.addEventListener('click', (e) => { if(e.target === admModal) closeAdmin(); });

  document.getElementById('admTrigger').addEventListener('click', openAdmin);
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){ closeAdmin(); closeHistory(); closeFish(); }
  });

  // ===== Hitungan poin berdasarkan jenis ikan =====
  const FISH = [{n:'Secret',p:1},{n:'Big',p:1},{n:'Shiny',p:1},{n:'Mutasi',p:1},{n:'Pelagon',p:2},{n:'Mutant Cosmic',p:2},{n:'Megalodon',p:3},{n:'Glacial',p:3},{n:'FB 100+',p:3},{n:'FB Maxton',p:5},{n:'Forgotten',p:5}];
  const fishModal = document.getElementById('fishModal');
  const fishList = document.getElementById('fishList');
  let fishTarget = null;
  fishList.innerHTML = FISH.map((f,i) =>
    '<label class="fish-opt"><input type="checkbox" data-i="'+i+'"> '+f.n+'<span class="fp">+'+f.p+'P</span></label>').join('');

  function fishPicked(){ return [...fishList.querySelectorAll('input:checked')].map(c => FISH[+c.dataset.i]); }
  function updateFishTotal(){
    document.getElementById('fishTotal').textContent = '+' + fishPicked().reduce((a,f) => a + f.p, 0);
  }
  function openFish(id){
    fishTarget = id;
    const t = teams.find(x => x.id === id);
    document.getElementById('fishSub').textContent = t.nickname || t.name || ('Peserta #' + id);
    fishList.querySelectorAll('input').forEach(c => c.checked = false);
    updateFishTotal();
    fishModal.classList.add('open');
  }
  function closeFish(){ fishModal.classList.remove('open'); fishTarget = null; }
  fishList.addEventListener('change', updateFishTotal);
  document.getElementById('fishClose').addEventListener('click', closeFish);
  fishModal.addEventListener('click', (e) => { if(e.target === fishModal) closeFish(); });
  document.getElementById('fishOk').addEventListener('click', () => {
    const picked = fishPicked();
    if(!picked.length || fishTarget === null){ closeFish(); return; }
    const t = teams.find(x => x.id === fishTarget);
    const delta = picked.reduce((a,f) => a + f.p, 0);
    t.points += delta;
    t.flash = { dir: 'up', time: Date.now() };   // kedip hijau (poin naik)
    t.history.push({ delta, after: t.points, time: Date.now(), label: picked.map(f => f.n).join(' + ') });
    closeFish();
    // Kosongkan search supaya siap untuk pencarian berikutnya (kolom search tetap terbuka)
    searchInput.value = '';
    render();
    searchInput.focus();
  });

  let renderTimer = null;
  let pendingFocus = null;
  function scheduleRender(delay = 550){
    if(renderTimer) clearTimeout(renderTimer);
    renderTimer = setTimeout(() => { renderTimer = null; render(); }, delay);
  }

  // Urutan: poin terbanyak di atas. Kalau poin sama, mengikuti urutan baris.
  function getSorted(){
    return [...teams].sort((a,b) => (b.points - a.points) || (a.id - b.id));
  }

  function formatTime(ts){
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  // Penanda poin: zero (0) = MERAH, pos (>0) = HIJAU (warnanya diatur di CSS)
  function applyScoreColor(tr, td, points){
    const tm = teams.find(x => x.id === Number(tr.dataset.id));
    tr.classList.toggle('blank', !tm || (tm.name || '').trim() === '');
    tr.classList.toggle('zero', points <= 0);
    tr.classList.toggle('pos', points > 0);
  }

  // Poin sama di peringkat 1-10: tiap kelompok poin yang sama dapat 1 warna yang sama
  let tieColor = {};
  let compRank = {};   // peringkat kompetisi: poin sama = peringkat sama (untuk medali)
  const TIE_COLORS = 5;
  const TIE_RANK_LIMIT = 10;
  function computeTies(sorted){
    compRank = {};
    // Fase poin awal / BIN: selama semua poin yang ada HANYA berasal dari bonus BIN,
    // nomor juara & warna berurutan 1, 2, 3, ... (tidak boleh 1 semua).
    // Begitu ada poin dari luar BIN (ikan / manual), poin sama baru boleh berperingkat sama.
    const binPhase = sorted.every(t => t.points === 0 || t.points === t.binGiven);
    if(binPhase){
      sorted.forEach((t, i) => { compRank[t.id] = i + 1; });
      tieColor = {};
      return;
    }
    sorted.forEach(t => {
      compRank[t.id] = 1 + sorted.filter(o => o.points > t.points).length;
    });
    const count = {};
    // Hanya poin sama yang memperebutkan juara 1, 2, atau 3 (peringkat kompetisi <= 3) yang diberi warna kelompok.
    // Poin sama di peringkat 4 ke bawah tidak diwarnai khusus (tetap hijau biasa).
    sorted.slice(0, TIE_RANK_LIMIT).forEach(t => { if(t.points > 0 && compRank[t.id] <= 3) count[t.points] = (count[t.points] || 0) + 1; });
    tieColor = {};
    let idx = 0;
    sorted.slice(0, TIE_RANK_LIMIT).forEach(t => {
      if(t.points > 0 && count[t.points] > 1 && tieColor[t.points] === undefined){
        tieColor[t.points] = idx++ % TIE_COLORS;
      }
    });
  }

  // Warna peringkat:
  //  - baris bertanda merah (klik NO) -> merah solid (diatur CSS .red)
  //  - poin sama di peringkat 1-10  -> warna kelompok (sama untuk yang poinnya sama)
  //  - juara 1-3 (poin > 0, tidak seri) -> emas, perak, perunggu
  //  - lainnya -> hijau (poin > 0) / merah (poin 0) lewat applyScoreColor
  function applyRankColor(tr, rank, points){
    tr.classList.remove('rank-1','rank-2','rank-3','tie-0','tie-1','tie-2','tie-3','tie-4');
    if(points > 0 && rank <= TIE_RANK_LIMIT && tieColor[points] !== undefined){
      tr.classList.add('tie-' + tieColor[points]);
    } else if(points > 0 && rank <= 3){
      tr.classList.add('rank-' + rank);
    }
  }

  function openHistory(teamId){
    const t = teams.find(x => x.id === teamId);
    if(!t) return;
    histModalTitle.textContent = 'History';
    histModalSub.textContent = t.nickname || t.name || ('Peserta #' + t.id);
    histModalTitle.appendChild(histModalSub);
    if(!t.history.length){
      histModalBody.innerHTML = '<div class="hist-empty">Belum ada perubahan poin.</div>';
    } else {
      const items = t.history.slice().reverse().map(h => {
        const sign = h.delta > 0 ? '+' : '';
        const cls = h.delta > 0 ? 'pos' : 'neg';
        return '<li class="hist-item"><span class="hist-delta ' + cls + '">' + sign + h.delta + '</span>'
          + '<span class="hist-meta"><span class="hist-after">poin jadi ' + h.after + '</span>'
          + (h.label ? '<span class="hist-fish">' + h.label + '</span>' : '')
          + '<span class="hist-time">' + formatTime(h.time) + '</span></span></li>';
      }).join('');
      histModalBody.innerHTML = '<ul class="hist-list">' + items + '</ul>';
    }
    histModal.classList.add('open');
  }
  function closeHistory(){ histModal.classList.remove('open'); }
  histModalClose.addEventListener('click', closeHistory);
  histModal.addEventListener('click', (e) => { if(e.target === histModal) closeHistory(); });

  function buildRow(team, rank){
    const tr = document.createElement('tr');
    tr.dataset.id = team.id;
    if(team.id === 20) tr.classList.add('server');   // baris server = hijau solid
    if(team.red) tr.classList.add('red');            // baris bertanda merah

    const tdRank = document.createElement('td');
    tdRank.className = 'rank';
    // Juara 1-3 (poin > 0): nomor diganti medali emas, perak, perunggu
    const MEDALS = { 1:true, 2:true, 3:true };
    // Kalau poin sama (perebutan juara 1-3), semua yang seri dapat medali yang sama,
    // termasuk yang urutannya sudah di bawah nomor 3.
    const medalRank = compRank[team.id] || rank;
    if(team.points > 0 && MEDALS[medalRank]){
      const m = document.createElement('span');
      m.className = 'medal m' + medalRank;
      m.textContent = medalRank;
      tdRank.appendChild(m);
    } else {
      tdRank.textContent = rank;
    }

    // TOMBOL MERAH: klik kolom NO untuk mewarnai baris merah, klik lagi untuk membatalkan
    // (hanya warna; poin, urutan, dan medali tidak berubah). Baris No 20 (Admin) tidak bisa.
    if(team.id !== 20){
      tdRank.classList.add('red-toggle');
      tdRank.title = 'Klik untuk tandai MERAH / batalkan';
      tdRank.addEventListener('click', () => {
        const t = teams.find(x => x.id === team.id);
        t.red = !t.red;
        tr.classList.toggle('red', t.red);
      });
    }

    const tdName = document.createElement('td');
    tdName.className = 'name-cell';
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'team-name';
    nameInput.value = team.name;
    nameInput.placeholder = 'Nama Peserta';
    nameInput.dataset.id = team.id;
    nameInput.dataset.field = 'name';
    nameInput.addEventListener('input', (e) => {
      const t = teams.find(x => x.id === team.id);
      t.name = e.target.value;
      if(t.name.trim() === '') t.slotTime = 0;
      else if(!t.slotTime) t.slotTime = Date.now();
      tr.classList.toggle('blank', t.name.trim() === '');
      updateSlotInfo();
    });
    tdName.appendChild(nameInput);

    const tdNick = document.createElement('td');
    tdNick.className = 'name-cell';
    const nickInput = document.createElement('input');
    nickInput.type = 'text';
    nickInput.className = 'team-nick';
    nickInput.value = team.nickname;
    nickInput.placeholder = 'Nama Display';
    nickInput.dataset.id = team.id;
    nickInput.dataset.field = 'nick';
    nickInput.addEventListener('input', (e) => {
      teams.find(x => x.id === team.id).nickname = e.target.value;
      applySearch();
    });
    tdNick.appendChild(nickInput);

    const tdPoints = document.createElement('td');
    tdPoints.className = 'poin-cell';
    applyScoreColor(tr, tdPoints, team.points);
    applyRankColor(tr, rank, team.points);
    const pointsWrap = document.createElement('div');
    pointsWrap.className = 'points-wrap';

    const pointsInput = document.createElement('input');
    pointsInput.type = 'text';
    pointsInput.className = 'points';
    pointsInput.value = team.points;
    pointsInput.readOnly = true;
    pointsInput.tabIndex = -1;
    pointsInput.dataset.id = team.id;
    pointsInput.dataset.field = 'points';

    const addInput = document.createElement('input');
    addInput.type = 'number';
    addInput.className = 'points-add';
    addInput.placeholder = '±';
    addInput.title = 'Ketik angka positif untuk tambah, atau minus (mis. -2) untuk kurangi poin, lalu tekan Enter atau tombol +';
    addInput.dataset.id = team.id;
    addInput.dataset.field = 'add';
    addInput.value = '0';
    addInput.min = '-999';
    addInput.addEventListener('focus', (e) => e.target.select());

    // useDefault = true  -> kalau kolom ± kosong, pakai nilai + POINT BIN (atau 1)
    function commitAdd(useDefault, subtract){
      let delta = parseInt(addInput.value, 10);
      if(isNaN(delta) && useDefault === true) delta = getPlusDefault();
      if(subtract === true && !isNaN(delta)) delta = -Math.abs(delta);
      if(isNaN(delta) || delta === 0){ addInput.value = '0'; return; }
      const t = teams.find(x => x.id === team.id);
      const newPoints = Math.max(0, t.points + delta);
      const actualDelta = newPoints - t.points;
      t.points = newPoints;
      // kedip: hijau kalau poin naik, biru kalau poin turun
      if(actualDelta) t.flash = { dir: actualDelta > 0 ? 'up' : 'down', time: Date.now() };
      if(actualDelta) t.history.push({ delta: actualDelta, after: newPoints, time: Date.now(), label: 'Manual' });
      pointsInput.value = t.points;
      applyScoreColor(tr, tdPoints, t.points);
      applyRankColor(tr, rank, t.points);
      addInput.value = '0';
      pendingFocus = { id: team.id, field: 'add' };
      scheduleRender();
    }
    addInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); commitAdd(); } });
    addInput.addEventListener('blur', () => {
      if(addInput.value !== '' && addInput.value !== '0') commitAdd();
      else addInput.value = '0';
    });

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'add-btn';
    addBtn.textContent = '+';
    addBtn.title = 'Tambahkan poin (kolom ± kosong = pakai nilai + POINT BIN di atas)';
    addBtn.addEventListener('mousedown', (e) => e.preventDefault());   // cegah blur memicu commit dobel
    addBtn.addEventListener('click', () => commitAdd(true));

    const fishBtn = document.createElement('button');
    fishBtn.type = 'button';
    fishBtn.className = 'fish-btn';
    const fishImg = document.createElement('img');
    fishImg.src = FISH_IMG;
    fishImg.alt = 'Tambah poin';
    fishImg.draggable = false;
    fishBtn.appendChild(fishImg);
    fishBtn.title = 'Tambah poin berdasarkan jenis ikan';
    fishBtn.addEventListener('click', () => openFish(team.id));

    pointsWrap.append(pointsInput, addInput, addBtn, fishBtn);
    tdPoints.appendChild(pointsWrap);

    // Kolom Pay: isi angka/huruf dulu. Kalau sudah terisi, KLIK 1x = tandai sudah bayar (hijau),
    // klik lagi = batal. Klik 2x (double-click) = edit isinya.
    const tdPay = document.createElement('td');
    tdPay.className = 'center';
    const payInput = document.createElement('input');
    payInput.type = 'text';
    payInput.className = 'pay-input';
    payInput.maxLength = 10;
    payInput.placeholder = '-';
    payInput.autocomplete = 'off';
    payInput.value = team.pay || '';
    payInput.dataset.id = team.id;
    payInput.dataset.field = 'pay';
    // Ukuran tulisan Pay menyesuaikan panjang isi: pendek = besar, panjang = mengecil agar muat di kolom
    function fitPay(){
      const n = payInput.value.length;
      payInput.style.fontSize = n <= 3 ? '' : n === 4 ? '.9em' : '.72em';
    }
    function refreshPay(){
      const t = teams.find(x => x.id === team.id);
      const filled = (t.pay || '') !== '';
      payInput.readOnly = filled;
      if(filled) payInput.value = t.pay.slice(0, 3);   // tampil 3 karakter pertama saja (isi lengkap tetap tersimpan)
      payInput.classList.toggle('locked', filled);
      payInput.classList.toggle('done', filled && !!t.paid);
      payInput.title = !filled ? 'Isi angka/huruf dulu'
        : ('Isi: ' + t.pay + ' — ' + (t.paid ? 'sudah bayar, klik untuk batalkan, klik 2x untuk edit' : 'klik untuk tandai sudah bayar, klik 2x untuk edit'));
      fitPay();
    }
    refreshPay();
    payInput.addEventListener('input', () => {
      const t = teams.find(x => x.id === team.id);
      t.pay = payInput.value.trim();
      if(!t.pay) t.paid = false;
      payInput.classList.toggle('done', !!t.paid && t.pay !== '');
      fitPay();
    });
    payInput.addEventListener('click', () => {
      if(!payInput.readOnly) return;
      const t = teams.find(x => x.id === team.id);
      t.paid = !t.paid;
      refreshPay();
    });
    payInput.addEventListener('dblclick', () => {
      payInput.readOnly = false;
      payInput.value = teams.find(x => x.id === team.id).pay;   // saat edit tampil isi lengkap
      fitPay();
      payInput.classList.remove('locked');
      payInput.focus();
      payInput.select();
    });
    payInput.addEventListener('blur', () => {
      refreshPay();
      const t = teams.find(x => x.id === team.id);
      if(syncBin(t)) scheduleRender();
    });
    payInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); payInput.blur(); } });
    tdPay.appendChild(payInput);

    const tdJoin = document.createElement('td');
    tdJoin.className = 'center';
    const joinBtn = document.createElement('button');
    joinBtn.type = 'button';
    joinBtn.dataset.id = team.id;
    joinBtn.dataset.field = 'join';
    function refreshJoin(){
      const t = teams.find(x => x.id === team.id);
      joinBtn.className = 'join-btn' + (t.joined ? ' joined' : '');
      joinBtn.textContent = '✓';
      joinBtn.title = t.joined ? 'Sudah absen — klik untuk batalkan' : 'Belum absen — klik untuk centang';
    }
    refreshJoin();
    joinBtn.addEventListener('click', () => {
      const t = teams.find(x => x.id === team.id);
      t.joined = !t.joined;
      refreshJoin();
    });
    tdJoin.appendChild(joinBtn);

    const tdHist = document.createElement('td');
    tdHist.className = 'center';
    const histBtn = document.createElement('button');
    histBtn.type = 'button';
    histBtn.className = 'hist-btn';
    histBtn.title = 'Lihat history poin';
    histBtn.innerHTML = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
    if(team.history.length){
      const count = document.createElement('span');
      count.className = 'hist-count';
      count.textContent = team.history.length;
      histBtn.appendChild(count);
    }
    histBtn.addEventListener('click', () => openHistory(team.id));
    tdHist.appendChild(histBtn);

    // Kedip hijau (poin naik) / biru (poin turun); lanjut dari sisa waktu kalau baris dibangun ulang
    if(team.flash && Date.now() - team.flash.time < FLASH_MS){
      const el = Date.now() - team.flash.time;
      tr.classList.add(team.flash.dir === 'up' ? 'flash-up' : 'flash-down');
      [tdRank, tdName, tdPay, tdNick, tdPoints, tdJoin, tdHist].forEach(td => td.style.animationDelay = '-' + el + 'ms');
    }

    tr.append(tdRank, tdName, tdPay, tdNick, tdPoints, tdJoin, tdHist);
    return tr;
  }

  function render(){
    tbodyTop.innerHTML = '';
    tbodyBottom.innerHTML = '';
    const sorted = getSorted();
    computeTies(sorted);
    sorted.forEach((team, idx) => {
      const rank = idx + 1;
      (rank <= 10 ? tbodyTop : tbodyBottom).appendChild(buildRow(team, rank));
    });
    applySearch();
    updateSlotInfo();
    if(pendingFocus){
      const el = document.querySelector('[data-id="' + pendingFocus.id + '"][data-field="' + pendingFocus.field + '"]');
      if(el) el.focus();
      pendingFocus = null;
    }
  }
  render();

  // Kolom ADD USN dan MAP melebar otomatis mengikuti panjang tulisan (minimal 7em, maksimal 20em)
  function autoGrow(input){
    const m = document.createElement('span');
    m.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;pointer-events:none;left:-9999px;top:0;';
    input.parentNode.appendChild(m);
    function fit(){
      const cs = getComputedStyle(input);
      m.style.font = cs.font;
      m.style.letterSpacing = cs.letterSpacing;
      m.style.textTransform = cs.textTransform;
      m.textContent = input.value || input.placeholder;
      const fs = parseFloat(cs.fontSize);
      const extra = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth) + 6;
      input.style.width = Math.min(Math.max(m.offsetWidth + extra, fs * 5.2), fs * 30) + 'px';
    }
    input.addEventListener('input', fit);
    input.addEventListener('change', fit);
    input.fitSize = fit;
    fit();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  }
  autoGrow(document.getElementById('addUsn'));

  // ===== Kolom MAP: pilih dari daftar ATAU ketik sendiri =====
  // Edit daftar pilihan map di sini (tambah/hapus sesuka hati):
  const MAP_OPTIONS = ['Sisyphus Isle', 'Planet Observatory', 'Megalodon', 'Creater', 'Glacial',];
  const mapInput = document.getElementById('addMap');
  const mapClear = document.getElementById('mapClear');
  const mapList = document.getElementById('mapList');
  MAP_OPTIONS.forEach(name => {
    const o = document.createElement('option');
    o.value = name.toUpperCase();
    mapList.appendChild(o);
  });
  autoGrow(mapInput);

  // Saat diklik/fokus: kosongkan sementara supaya SEMUA pilihan muncul (isi lama dipulihkan kalau tidak jadi memilih)
  let mapPrev = '';
  mapInput.addEventListener('focus', () => {
    mapPrev = mapInput.value;
    if(mapInput.value){ mapInput.value = ''; mapInput.fitSize(); }
  });
  mapInput.addEventListener('blur', () => {
    if(mapInput.value.trim() === '' && mapPrev) mapInput.value = mapPrev;
    mapPrev = '';
    mapInput.fitSize();
    mapClear.style.display = mapInput.value ? 'inline-block' : 'none';
  });
  mapInput.addEventListener('input', () => {
    mapPrev = '';   // sudah mengetik/memilih sesuatu, jangan dipulihkan lagi
    mapClear.style.display = mapInput.value ? 'inline-block' : 'none';
  });
  mapInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); mapInput.blur(); } });
  // Tombol ✕ = kosongkan MAP
  mapClear.addEventListener('mousedown', (e) => e.preventDefault());
  mapClear.addEventListener('click', () => {
    mapInput.value = ''; mapPrev = '';
    mapClear.style.display = 'none';
    mapInput.fitSize();
  });

  // JAM START: klik kotaknya langsung membuka pemilih jam (kalau browser mendukung)
  const jamStart = document.getElementById('jamStart');
  jamStart.addEventListener('click', () => {
    try { if(jamStart.showPicker) jamStart.showPicker(); } catch(e) {}
  });

  // Skala otomatis: tampilan didesain 1400px lalu diperkecil/diperbesar agar pas selebar layar (tanpa scroll)
  const wrapEl = document.querySelector('.wrap');
  const DESIGN_W = 1400;
  function fitToScreen(){
    const avail = document.documentElement.clientWidth - 20;
    const scale = Math.max(0.2, Math.min(avail / DESIGN_W, 1.6));
    if('zoom' in document.body.style){
      wrapEl.style.zoom = scale;
    } else {
      wrapEl.style.transformOrigin = 'top left';
      wrapEl.style.transform = 'scale(' + scale + ')';
      wrapEl.style.marginLeft = Math.max(0, (avail - DESIGN_W * scale) / 2) + 'px';
      wrapEl.style.marginBottom = (-(1 - scale) * wrapEl.offsetHeight) + 'px';
    }
  }
  window.addEventListener('resize', fitToScreen);
  fitToScreen();
</script>
</body>

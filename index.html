<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Galatama Taaronnn7Store X NicotinStore</title>
<style>
  :root{
    --grid:#BFBFBF;
    --ink:#000000;
    --muted:#3D3D3D;
    --sheet-bg:#F3F3F3;
    --cell-bg:#FFFFFF;
    --title-bg:#FFFF00;
    --head-bg:#F5A623;
    --poin-head:#F8CBAD;
    --poin-cell:#F4CCB4;
    --paid-bg:#92D69B;
    --green:#137E43;
    --red:#C0392B;
    --sel-border:#107C41;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--sheet-bg);
    font-family:Calibri,'Segoe UI',Arial,sans-serif;color:var(--ink);
    padding:32px 16px 60px;font-size:19px;font-weight:600;
  }
  .wrap{max-width:1350px;margin:0 auto;}
  .panel{
    background:var(--cell-bg);border:1px solid var(--grid);border-radius:4px;
    padding:14px;box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  .table-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
  table{width:100%;min-width:680px;border-collapse:collapse;table-layout:fixed;background:var(--cell-bg);}
  col.col-rank{width:54px;}
  col.col-name{width:180px;}
  col.col-nick{width:170px;}
  col.col-points{width:160px;}
  col.col-pay{width:56px;}
  col.col-hist{width:72px;}

  .titles{margin-bottom:12px;}
  .title-bar{background:var(--title-bg);border:1px solid var(--grid);margin-bottom:-1px;}
  .tables{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:820px){.tables{grid-template-columns:1fr;}}
  td.rank{text-align:center;font-weight:800;font-size:26px;}
  /* ===== Baris judul (kuning) ===== */
  th.title{background:var(--title-bg);border:1px solid var(--grid);padding:0;}
  input.title-input{
    width:100%;border:none;background:transparent;font-family:inherit;font-weight:800;
    font-size:28px;text-align:center;color:var(--ink);padding:14px 6px;text-transform:uppercase;
  }
  input.title-input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--sel-border);}

  /* ===== Header kolom (oranye) ===== */
  th.colhead{
    background:var(--head-bg);border:1px solid var(--grid);font-weight:800;font-size:22px;
    color:var(--ink);text-align:center;padding:12px 3px;
  }
  th.colhead.poin{background:var(--poin-head);}

  /* ===== Isi ===== */
  tbody td{
    border:1px solid var(--grid);background:var(--cell-bg);vertical-align:middle;
    padding:0;height:66px;font-size:26px;
  }
  tbody td.poin-cell{background:var(--poin-cell);text-align:center;padding:2px 4px;}
  tbody tr.paid td.name-cell{background:var(--paid-bg);}
  td.center{text-align:center;}

  input.team-name, input.team-nick{
    width:100%;border:none;background:transparent;font-family:inherit;font-weight:800;
    font-size:26px;color:var(--ink);padding:10px 8px;text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  input.team-name::placeholder, input.team-nick::placeholder{color:var(--muted);opacity:0.4;font-weight:600;}
  input.team-name:focus, input.team-nick:focus{
    outline:none;background:#FFFFFF;box-shadow:inset 0 0 0 2px var(--sel-border);text-align:left;
  }

  .points-wrap{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;flex-wrap:nowrap;}
  input.points{
    width:56px;border:none;background:transparent;font-family:inherit;font-weight:800;
    font-size:32px;color:var(--ink);text-align:center;padding:4px 0;flex:none;cursor:default;
  }
  input.points:focus{outline:none;}
  input.points-add{
    width:44px;border:1px dashed #9A9A9A;background:rgba(255,255,255,0.7);font-family:inherit;
    font-weight:700;font-size:18px;color:var(--muted);text-align:center;padding:8px 1px;border-radius:2px;
  }
  input.points-add::placeholder{color:#8A8A8A;}
  input.points-add:focus{outline:none;border-color:var(--green);border-style:solid;color:var(--ink);background:#fff;}
  .add-btn{
    width:28px;height:34px;flex:none;border-radius:2px;border:1px solid var(--green);
    background:rgba(255,255,255,0.7);color:var(--green);font-family:inherit;font-weight:700;
    font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  }
  .add-btn:hover{background:#fff;}
  .add-btn:active{transform:scale(0.9);}

  /* ===== Pay ===== */
  .pay-btn{
    width:38px;height:42px;border-radius:3px;cursor:pointer;font-size:24px;font-weight:800;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;padding:0;font-family:inherit;
    transition:background 0.12s ease, border-color 0.12s ease, color 0.12s ease, transform 0.08s ease;
    user-select:none;background:#FFFFFF;border:1px solid var(--grid);color:#A9A9A9;
  }
  .pay-btn:active{transform:scale(0.9);}
  .pay-btn.paid{background:rgba(19,126,67,0.15);border-color:var(--green);color:var(--green);}
  .pay-btn.unpaid{background:rgba(192,57,43,0.12);border-color:var(--red);color:var(--red);}

  /* ===== History ===== */
  .hist-btn{
    display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
    border-radius:2px;border:1px solid var(--grid);background:#FFFFFF;color:var(--muted);
    font-size:22px;cursor:pointer;position:relative;transition:border-color 0.12s ease;
  }
  .hist-btn:hover{border-color:var(--sel-border);}
  .hist-btn:active{transform:scale(0.92);}
  .hist-btn .hist-count{
    position:absolute;top:-6px;right:-6px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;
    background:var(--red);color:#fff;font-size:9px;font-weight:700;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }

  /* ===== Modal ===== */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:100;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    width:100%;max-width:380px;max-height:80vh;display:flex;flex-direction:column;background:#FFFFFF;
    border:1px solid var(--grid);border-radius:4px;box-shadow:0 12px 32px rgba(0,0,0,0.25);overflow:hidden;
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;
    background:var(--title-bg);border-bottom:1px solid var(--grid);
  }
  .modal-title{font-weight:700;font-size:14px;color:var(--ink);}
  .modal-title small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px;}
  .modal-close{
    width:24px;height:24px;border-radius:2px;border:1px solid var(--grid);background:#fff;
    color:var(--muted);font-size:13px;line-height:1;cursor:pointer;flex:none;
  }
  .modal-close:hover{border-color:var(--red);color:var(--red);}
  .modal-body{overflow-y:auto;padding:6px 14px 14px;}
  .hist-empty{text-align:center;color:var(--muted);font-size:12.5px;padding:20px 8px;}
  .hist-list{list-style:none;margin:0;padding:0;}
  .hist-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:7px 0;border-bottom:1px solid #E1E1E1;
  }
  .hist-item:last-child{border-bottom:none;}
  .hist-delta{font-weight:700;font-size:13px;min-width:44px;}
  .hist-delta.pos{color:var(--green);}
  .hist-delta.neg{color:var(--red);}
  .hist-meta{flex:1;text-align:right;}
  .hist-time{font-size:11px;color:var(--muted);display:block;}
  .hist-after{font-size:10.5px;color:var(--muted);display:block;margin-top:1px;}

  /* ===== Rules ===== */
  .rules-note{
    display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:8px 14px;
    background:#E6F5EC;border:2px solid var(--green);border-left:6px solid var(--green);
    border-radius:6px;color:#000;white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  .rules-note .rules-icon{font-size:20px;line-height:1;flex:none;}
  .rules-note .rules-title{
    flex:none;background:var(--green);color:#fff;font-size:17px;font-weight:800;
    letter-spacing:1.2px;text-transform:uppercase;padding:3px 12px;border-radius:4px;
  }
  .rules-note .rules-text{flex:none;font-size:19px;line-height:1.3;font-weight:900;color:#000;}
  .rules-note .rules-text u{text-decoration-thickness:2px;text-underline-offset:3px;color:#0B4A28;font-weight:900;}
  @media (max-width:820px){
    .rules-note .rules-text{font-size:16px;}
    .rules-note .rules-title{font-size:15px;}
  }
  /* ===== Tanpa scroll: semua ukuran menyesuaikan lebar layar ===== */
  :root{--fs:clamp(12px,1.45vw,24px);}
  @media (max-width:900px){
    :root{--fs:clamp(12px,3.2vw,24px);}
    .tables{grid-template-columns:1fr;}
  }
  .table-scroll{overflow:visible;}
  table{min-width:0;width:100%;font-size:var(--fs);}
  col.col-rank{width:8%;}
  col.col-name{width:25%;}
  col.col-nick{width:25%;}
  col.col-points{width:22%;}
  col.col-pay{width:10%;}
  col.col-hist{width:10%;}
  th.colhead{font-size:1em;padding:.6em 2px;}
  tbody td{height:auto;font-size:1em;}
  td.rank{font-size:1em;}
  input.team-name, input.team-nick{font-size:1em;padding:.75em .2em;}
  td.poin-cell{padding:2px 1px;}
  .points-wrap{gap:2px;}
  input.points{width:1.8em;font-size:1.3em;padding:2px 0;}
  input.points-add{width:1.9em;font-size:.8em;padding:.55em 0;}
  .add-btn{width:1.2em;height:1.8em;font-size:1em;}
  .pay-btn{width:1.5em;height:1.7em;font-size:1em;}
  .hist-btn{width:1.7em;height:1.7em;font-size:1em;}
  input.title-input{font-size:calc(var(--fs) * 1.5);padding:.5em 6px;}
  /* ===== Search ===== */
  .search-bar{
    display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:6px 12px;
    background:#FFFFFF;border:2px solid var(--head-bg);border-radius:6px;
  }
  .search-bar:focus-within{border-color:var(--sel-border);}
  .search-icon{font-size:calc(var(--fs) * 1.2);flex:none;}
  #searchInput{
    flex:1;min-width:0;border:none;background:transparent;font-family:inherit;font-weight:700;
    font-size:calc(var(--fs) * 1.2);color:var(--ink);padding:.4em 4px;
  }
  #searchInput:focus{outline:none;}
  #searchClear{
    display:none;flex:none;width:1.8em;height:1.8em;border-radius:3px;border:1px solid var(--grid);
    background:#fff;color:var(--muted);font-size:calc(var(--fs) * 0.9);cursor:pointer;line-height:1;
  }
  #searchClear:hover{border-color:var(--red);color:var(--red);}
  /* Saat search aktif: baris lain diredupkan, baris cocok disorot kuning penuh */
  .search-bar.active{border-color:#E65100;background:#FFF8E1;}
  #searchCount{
    display:none;flex:none;font-weight:800;font-size:calc(var(--fs) * 0.9);padding:.2em .7em;
    border-radius:999px;color:#fff;background:var(--green);white-space:nowrap;
  }
  #searchCount.none{background:var(--red);}
  body.searching tbody tr{opacity:0.3;transition:opacity 0.15s ease;}
  body.searching tbody tr.search-hit{opacity:1;}
  tbody tr.search-hit td,
  tbody tr.search-hit td.name-cell,
  tbody tr.search-hit td.poin-cell{background:#FFF176;box-shadow:inset 0 4px 0 #E65100, inset 0 -4px 0 #E65100;}
  tbody tr.search-hit td:first-child{box-shadow:inset 4px 0 0 #E65100, inset 0 4px 0 #E65100, inset 0 -4px 0 #E65100;}
  tbody tr.search-hit td:last-child{box-shadow:inset -4px 0 0 #E65100, inset 0 4px 0 #E65100, inset 0 -4px 0 #E65100;}
  /* ===== Search diperkecil ===== */
  .search-bar{max-width:340px;margin:0 0 8px;padding:2px 8px;gap:6px;border-width:2px;}
  .search-icon{font-size:calc(var(--fs) * 0.95);}
  #searchInput{font-size:calc(var(--fs) * 0.95);padding:.25em 2px;}
  #searchCount{font-size:calc(var(--fs) * 0.7);padding:.15em .55em;}
  #searchClear{width:1.5em;height:1.5em;font-size:calc(var(--fs) * 0.75);}

  /* ===== Kolom History tidak luber ===== */
  col.col-rank{width:8%;}
  col.col-name{width:24%;}
  col.col-nick{width:24%;}
  col.col-points{width:22%;}
  col.col-pay{width:10%;}
  col.col-hist{width:12%;}
  .hist-btn{width:1.5em;height:1.5em;max-width:100%;}
  .hist-btn .hist-count{top:-.4em;right:-.4em;min-width:14px;height:14px;font-size:max(9px,.5em);}
  tbody td:last-child, thead th:last-child{padding-left:.4em;padding-right:.4em;overflow:visible;}
  .pay-btn{max-width:100%;}
  /* ===== Fix final: search boleh panjang, header History muat ===== */
  .search-bar{max-width:none;}
  col.col-name{width:23%;}
  col.col-nick{width:23%;}
  col.col-hist{width:14%;}
  thead th:last-child{font-size:.72em;padding:.85em 0;white-space:nowrap;overflow:hidden;text-overflow:clip;letter-spacing:0;}
  tbody td:last-child{padding-left:2px;padding-right:2px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="rules-note">
      <span class="rules-icon">⚠️</span>
      <span class="rules-title">Rules</span>
      <span class="rules-text">Jika poin sama, urutan peringkat: (1) Nama <u>Bin</u> paling atas. (2) Sesama Bin, yang <u>slot lebih awal</u> di atas. (3) Selain Bin, yang <u>slot lebih awal</u> di atas.</span>
    </div>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Cari Nama Display, Enter untuk isi poin..." autocomplete="off">
      <span id="searchCount"></span>
      <button type="button" id="searchClear" title="Hapus pencarian">✕</button>
    </div>
    <div class="tables">
      <div class="table-scroll">
        <table>
            <colgroup>
              <col class="col-rank"><col class="col-name"><col class="col-nick"><col class="col-points"><col class="col-pay"><col class="col-hist">
            </colgroup>
            <thead>
              <tr>
                <th class="colhead">No</th>
                <th class="colhead">Nama Peserta</th>
                <th class="colhead">Nama Display</th>
                <th class="colhead poin">POIN</th>
                <th class="colhead">Pay</th>
                <th class="colhead">History</th>
              </tr>
            </thead>
            <tbody id="tableBodyTop"></tbody>
        </table>
      </div>
      <div class="table-scroll">
        <table>
            <colgroup>
              <col class="col-rank"><col class="col-name"><col class="col-nick"><col class="col-points"><col class="col-pay"><col class="col-hist">
            </colgroup>
            <thead>
              <tr>
                <th class="colhead">No</th>
                <th class="colhead">Nama Peserta</th>
                <th class="colhead">Nama Display</th>
                <th class="colhead poin">POIN</th>
                <th class="colhead">Pay</th>
                <th class="colhead">History</th>
              </tr>
            </thead>
            <tbody id="tableBodyBottom"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="histModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="histModalTitle">History<small id="histModalSub"></small></div>
      <button type="button" class="modal-close" id="histModalClose">✕</button>
    </div>
    <div class="modal-body" id="histModalBody"></div>
  </div>
</div>

<script>
  const namaPeserta = ["","","","","","","","","","","","","","","","","","","",""];
  const nicknamePeserta = ["","","","","","","","","","","","","","","","","","","",""];
  const defaultTeams = [];
  for(let i=1;i<=20;i++){
    // paid: false = silang (belum bayar), true = ceklis (sudah bayar)
    defaultTeams.push({ id:i, name:namaPeserta[i-1], nickname:nicknamePeserta[i-1], points:0, paid:false, slotTime:0, history:[] });
  }

  let teams = JSON.parse(JSON.stringify(defaultTeams));

  const tbodyTop = document.getElementById('tableBodyTop');
  const tbodyBottom = document.getElementById('tableBodyBottom');
  const histModal = document.getElementById('histModal');
  const histModalBody = document.getElementById('histModalBody');
  const histModalTitle = document.getElementById('histModalTitle');
  const histModalSub = document.getElementById('histModalSub');
  const histModalClose = document.getElementById('histModalClose');

  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');

  // Cari berdasarkan Nama Display: semua baris tetap tampil, baris yang cocok disorot.
  // Tekan Enter untuk langsung pindah ke kolom poin (±) baris pertama yang cocok.
  function applySearch(scroll){
    const q = searchInput.value.trim().toLowerCase();
    searchClear.style.display = q ? 'block' : 'none';
    let first = null, count = 0;
    document.querySelectorAll('#tableBodyTop tr, #tableBodyBottom tr').forEach(tr => {
      const t = teams.find(x => x.id === Number(tr.dataset.id));
      const hit = !!q && !!t && (t.nickname || '').toLowerCase().includes(q);
      tr.classList.toggle('search-hit', hit);
      if(hit){ count++; if(!first) first = tr; }
    });
    document.body.classList.toggle('searching', !!q);
    document.querySelector('.search-bar').classList.toggle('active', !!q);
    const cnt = document.getElementById('searchCount');
    cnt.style.display = q ? 'inline-block' : 'none';
    cnt.classList.toggle('none', !!q && count === 0);
    cnt.textContent = count ? (count + ' ditemukan') : 'Tidak ditemukan';
    if(scroll && first) first.scrollIntoView({ block:'center', behavior:'smooth' });
  }
  searchInput.addEventListener('input', () => applySearch(true));
  searchInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      const target = document.querySelector('tr.search-hit input.points-add');
      if(target) target.focus();
    }
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    applySearch();
    searchInput.focus();
  });

  let renderTimer = null;
  let pendingFocus = null;

  function scheduleRender(delay = 550){
    if(renderTimer) clearTimeout(renderTimer);
    renderTimer = setTimeout(() => { renderTimer = null; render(); }, delay);
  }

  // Nama mengandung kata utuh "bin" (tidak peka huruf besar/kecil).
  // Ganti ke /bin/i jika ingin semua nama yang memuat "bin" ikut terdeteksi.
  function isBin(team){
    return /\bbin\b/i.test(team.name || '');
  }

  // Urutan: poin terbanyak dulu. Jika poin sama:
  // 1) nama "Bin" di atas, 2) slot lebih awal di atas.
  function slotKey(t){ return t.slotTime || Infinity; }

  function getSorted(){
    return [...teams].sort((a,b) => {
      if(b.points !== a.points) return b.points - a.points;
      const aBin = isBin(a), bBin = isBin(b);
      if(aBin !== bBin) return aBin ? -1 : 1;
      const ka = slotKey(a), kb = slotKey(b);
      if(ka !== kb) return ka < kb ? -1 : 1;
      return a.id - b.id;
    });
  }

  function formatTime(ts){
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function openHistory(teamId){
    const t = teams.find(x => x.id === teamId);
    if(!t) return;
    const label = t.nickname || t.name || ('Peserta #' + t.id);
    histModalTitle.textContent = 'History';
    histModalSub.textContent = label;
    histModalTitle.appendChild(histModalSub);

    if(!t.history.length){
      histModalBody.innerHTML = '<div class="hist-empty">Belum ada perubahan poin.</div>';
    } else {
      const items = [...t.history].slice().reverse().map(h => {
        const sign = h.delta > 0 ? '+' : '';
        const cls = h.delta > 0 ? 'pos' : 'neg';
        return '<li class="hist-item">'
          + '<span class="hist-delta ' + cls + '">' + sign + h.delta + '</span>'
          + '<span class="hist-meta"><span class="hist-after">poin jadi ' + h.after + '</span>'
          + '<span class="hist-time">' + formatTime(h.time) + '</span></span>'
          + '</li>';
      }).join('');
      histModalBody.innerHTML = '<ul class="hist-list">' + items + '</ul>';
    }
    histModal.classList.add('open');
  }

  function closeHistory(){ histModal.classList.remove('open'); }
  histModalClose.addEventListener('click', closeHistory);
  histModal.addEventListener('click', (e) => { if(e.target === histModal) closeHistory(); });

  function buildRow(team, rank){
    const tr = document.createElement('tr');
    tr.dataset.id = team.id;
    if(team.paid) tr.classList.add('paid');

    const tdRank = document.createElement('td');
    tdRank.className = 'rank';
    tdRank.textContent = rank;

    const tdName = document.createElement('td');
    tdName.className = 'name-cell';
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'team-name';
    nameInput.value = team.name;
    nameInput.placeholder = 'Nama Peserta';
    nameInput.dataset.id = team.id;
    nameInput.dataset.field = 'name';
    nameInput.addEventListener('input', (e) => {
      const t = teams.find(x => x.id === team.id);
      t.name = e.target.value;
      if(t.name.trim() === '') t.slotTime = 0;
      else if(!t.slotTime) t.slotTime = Date.now();
    });
    nameInput.addEventListener('change', () => scheduleRender());
    tdName.appendChild(nameInput);

    const tdNick = document.createElement('td');
    tdNick.className = 'name-cell';
    const nickInput = document.createElement('input');
    nickInput.type = 'text';
    nickInput.className = 'team-nick';
    nickInput.value = team.nickname;
    nickInput.placeholder = 'Nama Display';
    nickInput.dataset.id = team.id;
    nickInput.dataset.field = 'nick';
    nickInput.addEventListener('input', (e) => {
      const t = teams.find(x => x.id === team.id);
      t.nickname = e.target.value;
      applySearch();
    });
    tdNick.appendChild(nickInput);

    const tdPoints = document.createElement('td');
    tdPoints.className = 'poin-cell';
    const pointsWrap = document.createElement('div');
    pointsWrap.className = 'points-wrap';

    const pointsInput = document.createElement('input');
    pointsInput.type = 'text';
    pointsInput.className = 'points';
    pointsInput.value = team.points;
    pointsInput.readOnly = true;
    pointsInput.tabIndex = -1;
    pointsInput.dataset.id = team.id;
    pointsInput.dataset.field = 'points';

    const addInput = document.createElement('input');
    addInput.type = 'number';
    addInput.className = 'points-add';
    addInput.placeholder = '±';
    addInput.title = 'Ketik angka positif untuk tambah, atau minus (mis. -2) untuk kurangi poin, lalu tekan Enter atau tombol +';
    addInput.dataset.id = team.id;
    addInput.dataset.field = 'add';
    addInput.addEventListener('focus', (e) => e.target.select());

    function commitAdd(){
      const delta = parseInt(addInput.value, 10);
      if(isNaN(delta) || delta === 0){ addInput.value = ''; return; }
      const t = teams.find(x => x.id === team.id);
      const newPoints = Math.max(0, t.points + delta);
      const actualDelta = newPoints - t.points;
      t.points = newPoints;
      if(actualDelta) t.history.push({ delta: actualDelta, after: newPoints, time: Date.now() });
      pointsInput.value = t.points;
      addInput.value = '';
      pendingFocus = { id: team.id, field: 'add' };
      scheduleRender();
    }

    addInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); commitAdd(); }
    });
    addInput.addEventListener('blur', () => { if(addInput.value !== '') commitAdd(); });

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'add-btn';
    addBtn.textContent = '+';
    addBtn.title = 'Tambahkan poin';
    addBtn.addEventListener('click', commitAdd);

    pointsWrap.appendChild(pointsInput);
    pointsWrap.appendChild(addInput);
    pointsWrap.appendChild(addBtn);
    tdPoints.appendChild(pointsWrap);

    // ===== Pay: satu ikon ✗ / ✓ =====
    const tdPay = document.createElement('td');
    tdPay.className = 'center';
    const payBtn = document.createElement('button');
    payBtn.type = 'button';
    payBtn.dataset.id = team.id;
    payBtn.dataset.field = 'pay';

    function refreshPay(){
      const t = teams.find(x => x.id === team.id);
      payBtn.className = 'pay-btn ' + (t.paid ? 'paid' : 'unpaid');
      payBtn.textContent = t.paid ? '✓' : '✗';
      payBtn.title = t.paid ? 'Sudah bayar — klik untuk batalkan' : 'Belum bayar — klik untuk tandai lunas';
      tr.classList.toggle('paid', !!t.paid);
    }
    refreshPay();
    payBtn.addEventListener('click', () => {
      const t = teams.find(x => x.id === team.id);
      t.paid = !t.paid;
      refreshPay();
    });
    tdPay.appendChild(payBtn);

    // ===== History =====
    const tdHist = document.createElement('td');
    tdHist.className = 'center';
    const histBtn = document.createElement('button');
    histBtn.type = 'button';
    histBtn.className = 'hist-btn';
    histBtn.title = 'Lihat history poin';
    histBtn.textContent = '🕘';
    if(team.history.length){
      const count = document.createElement('span');
      count.className = 'hist-count';
      count.textContent = team.history.length;
      histBtn.appendChild(count);
    }
    histBtn.addEventListener('click', () => openHistory(team.id));
    tdHist.appendChild(histBtn);

    tr.appendChild(tdRank);
    tr.appendChild(tdName);
    tr.appendChild(tdNick);
    tr.appendChild(tdPoints);
    tr.appendChild(tdPay);
    tr.appendChild(tdHist);
    return tr;
  }

  function render(){
    tbodyTop.innerHTML = '';
    tbodyBottom.innerHTML = '';
    getSorted().forEach((team, idx) => {
      const rank = idx + 1;
      (rank <= 10 ? tbodyTop : tbodyBottom).appendChild(buildRow(team, rank));
    });

    applySearch();

    if(pendingFocus){
      const el = document.querySelector('[data-id="' + pendingFocus.id + '"][data-field="' + pendingFocus.field + '"]');
      if(el) el.focus();
      pendingFocus = null;
    }
  }

  render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Galatama Taaronnn7Store X NicotinStore</title>
<style>
  :root{
    --grid:#E1E1E1;
    --grid-strong:#D0D0D0;
    --header-bg:#F2F2F2;
    --header-bg-dark:#E6E6E6;
    --colhead-bg:#217346;
    --colhead-text:#FFFFFF;
    --ink:#000000;
    --muted:#3D3D3D;
    --sheet-bg:#F3F3F3;
    --cell-bg:#FFFFFF;
    --row-alt:#F7FAF8;
    --sel-blue:#CAEAD8;
    --sel-blue-border:#107C41;
    --green:#137E43;
    --zero-red:#C0392B;
    --gold:#FFD966;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--sheet-bg);
    font-family:Calibri,'Segoe UI',Arial,sans-serif;
    color:var(--ink);
    padding:32px 16px 60px;
    font-size:19px;
    font-weight:600;
  }
  .wrap{max-width:1350px;margin:0 auto;}
  .panel{
    background:var(--cell-bg);
    border:1px solid var(--grid-strong);
    border-radius:4px;
    padding:14px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  .tables{display:grid;grid-template-columns:1fr 1fr;gap:16px;position:relative;}
  @media (max-width:820px){.tables{grid-template-columns:1fr;}}
  .table-col{display:flex;flex-direction:column;}
  .table-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-radius:8px;}
  table{width:100%;min-width:578px;border-collapse:collapse;table-layout:fixed;background:var(--cell-bg);}
  thead th{
    font-weight:800;font-size:17px;color:var(--ink);text-align:center;
    padding:12px 6px;background:var(--header-bg);border:1px solid var(--grid-strong);
  }
  th.left{text-align:left;padding-left:10px;}
  col.col-rank{width:40px;}
  col.col-name{width:130px;}
  col.col-nick{width:130px;}
  col.col-points{width:112px;}
  col.col-catch{width:52px;}
  col.col-status{width:74px;}
  col.col-hist{width:40px;}
  tbody tr td{
    padding:11px 6px;border:1px solid var(--grid-strong);vertical-align:middle;
    background:var(--cell-bg);font-size:17px;
  }
  thead th:first-child{border-top-left-radius:7px;}
  thead th:last-child{border-top-right-radius:7px;}
  tbody tr:last-child td:first-child{border-bottom-left-radius:7px;}
  tbody tr:last-child td:last-child{border-bottom-right-radius:7px;}
  tbody tr:nth-child(even) td{background:var(--row-alt);}
  tbody tr:hover td{background:var(--sel-blue);}
  td.center{text-align:center;padding-left:4px;padding-right:4px;}
  td.rank{width:36px;text-align:center;}
  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:30px;border-radius:3px;background:var(--header-bg-dark);
    color:var(--ink);font-weight:700;font-size:17px;border:1px solid var(--grid-strong);
  }
  .badge.gold{background:var(--gold);color:#3D2E00;border-color:#C9A227;}
  .badge.silver{background:#E4E4E4;color:#1D1D1D;border-color:#B0B0B0;}
  .badge.bronze{background:#E3B08A;color:#2A0F06;border-color:#B36A50;}

  input.team-name, input.team-nick{
    width:100%;border:none;background:transparent;font-family:inherit;
    font-weight:700;font-size:17px;color:var(--ink);padding:6px 5px;border-radius:0;
  }
  input.team-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  input.team-nick{font-weight:800;}
  input.team-name::placeholder, input.team-nick::placeholder{color:var(--muted);opacity:0.55;}
  input.team-name:hover, input.team-nick:hover{background:rgba(33,115,70,0.06);}
  input.team-name:focus, input.team-nick:focus{
    outline:none;background:#FFFFFF;box-shadow:inset 0 0 0 2px var(--sel-blue-border);white-space:normal;
  }
  input.team-name.zero-points, input.team-nick.zero-points{color:var(--zero-red) !important;}
  input.team-name.high-points, input.team-nick.high-points{color:var(--green) !important;}

  input.points{
    width:100%;max-width:46px;border:1px solid var(--grid-strong);background:#FFFFFF;
    font-family:inherit;font-weight:800;font-size:20px;color:var(--ink);text-align:center;
    padding:7px 3px;border-radius:2px;transition:border-color 0.15s ease, color 0.15s ease;flex:none;
  }
  input.points:focus{outline:none;border-color:var(--sel-blue-border);box-shadow:0 0 0 2px rgba(16,124,65,0.25);}
  .points-wrap{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;flex-wrap:nowrap;}
  .add-row{display:flex;align-items:center;justify-content:center;}
  input.points-add{
    width:38px;border:1px dashed var(--grid-strong);background:#FFFFFF;font-family:inherit;
    font-weight:700;font-size:15px;color:var(--muted);text-align:center;padding:6px 2px;border-radius:2px;
  }
  input.points-add::placeholder{color:#A9A9A9;}
  input.points-add:focus{outline:none;border-color:var(--green);border-style:solid;color:var(--ink);}
  .add-btn{
    width:24px;height:24px;flex:none;border-radius:2px;border:1px solid var(--green);
    background:rgba(19,126,67,0.10);color:var(--green);font-family:inherit;font-weight:700;
    font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  }
  .add-btn:hover{background:rgba(19,126,67,0.20);}
  .add-btn:active{transform:scale(0.9);}
  input.points.zero-points{border-color:var(--zero-red);color:var(--zero-red);background:rgba(192,57,43,0.06);}
  input.points.high-points{border-color:var(--green);color:var(--green);background:rgba(19,126,67,0.08);}

  .hist-btn{
    display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
    border-radius:2px;border:1px solid var(--grid-strong);background:#FFFFFF;color:var(--muted);
    font-size:17px;cursor:pointer;position:relative;transition:border-color 0.12s ease, color 0.12s ease;
  }
  .hist-btn:hover{border-color:var(--sel-blue-border);color:var(--sel-blue-border);}
  .hist-btn:active{transform:scale(0.92);}
  .hist-btn .hist-count{
    position:absolute;top:-6px;right:-6px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;
    background:var(--zero-red);color:#fff;font-size:9px;font-weight:700;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .catch-badge{
    display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:48px;
    padding:6px 7px;border-radius:2px;background:#FFFFFF;border:1px solid var(--grid-strong);
    font-weight:800;font-size:18px;color:var(--ink);
  }
  .catch-badge .fish-icon{font-size:16px;line-height:1;}

  input.pay-input{
    width:100%;max-width:36px;min-width:32px;border:1px solid var(--grid-strong);background:#FFFFFF;
    font-family:inherit;font-weight:800;font-size:12px;color:var(--ink);text-align:center;
    padding:6px 2px;border-radius:2px;transition:border-color 0.15s ease, color 0.15s ease, background 0.15s ease;flex:none;
  }
  input.pay-input::placeholder{color:#A9A9A9;font-weight:600;}
  input.pay-input:focus{outline:none;border-color:var(--sel-blue-border);box-shadow:0 0 0 2px rgba(16,124,65,0.25);}
  input.pay-input.unpaid{border-color:var(--zero-red);color:var(--zero-red);background:rgba(192,57,43,0.06);}
  input.pay-input.paid{border-color:var(--green);color:var(--green);background:rgba(19,126,67,0.08);}
  .pay-wrap{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;flex-wrap:nowrap;width:100%;}
  .check-btn{
    width:20px;height:26px;flex:none;border-radius:3px;cursor:pointer;font-size:13px;font-weight:800;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:background 0.12s ease, border-color 0.12s ease, color 0.12s ease, transform 0.08s ease;
    user-select:none;background:#FFFFFF;border:1px solid var(--grid-strong);color:var(--muted);
  }
  .check-btn:active{transform:scale(0.9);}
  .check-btn.checked{background:rgba(19,126,67,0.15);border:1px solid var(--green);color:var(--green);}
  .check-btn:hover{border-color:var(--sel-blue-border);}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:100;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    width:100%;max-width:380px;max-height:80vh;display:flex;flex-direction:column;background:#FFFFFF;
    border:1px solid var(--grid-strong);border-radius:4px;box-shadow:0 12px 32px rgba(0,0,0,0.25);overflow:hidden;
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;
    background:var(--header-bg);border-bottom:1px solid var(--grid-strong);
  }
  .modal-title{font-weight:700;font-size:14px;color:var(--ink);}
  .modal-title small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px;}
  .modal-close{
    width:24px;height:24px;border-radius:2px;border:1px solid var(--grid-strong);background:#fff;
    color:var(--muted);font-size:13px;line-height:1;cursor:pointer;flex:none;
  }
  .modal-close:hover{border-color:var(--zero-red);color:var(--zero-red);}
  .modal-body{overflow-y:auto;padding:6px 14px 14px;}
  .hist-empty{text-align:center;color:var(--muted);font-size:12.5px;padding:20px 8px;}
  .hist-list{list-style:none;margin:0;padding:0;}
  .hist-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:7px 0;border-bottom:1px solid var(--grid);
  }
  .hist-item:last-child{border-bottom:none;}
  .hist-delta{font-weight:700;font-size:13px;min-width:44px;}
  .hist-delta.pos{color:var(--green);}
  .hist-delta.neg{color:var(--zero-red);}
  .hist-meta{flex:1;text-align:right;}
  .hist-time{font-size:11px;color:var(--muted);display:block;}
  .hist-after{font-size:10.5px;color:var(--muted);display:block;margin-top:1px;}

  /* ===== RULES BOX (satu baris) ===== */
  .rules-note{
    display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:8px 14px;
    background:#E6F5EC;border:2px solid var(--green);border-left:6px solid var(--green);
    border-radius:6px;color:#000000;white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  .rules-note .rules-icon{font-size:20px;line-height:1;flex:none;}
  .rules-note .rules-title{
    flex:none;background:var(--green);color:#FFFFFF;font-size:17px;font-weight:800;
    letter-spacing:1.2px;text-transform:uppercase;padding:3px 12px;border-radius:4px;
  }
  .rules-note .rules-text{flex:none;font-size:19px;line-height:1.3;font-weight:900;color:#000000;}
  .rules-note .rules-text u{
    text-decoration-thickness:2px;text-underline-offset:3px;color:#0B4A28;font-weight:900;
  }
  @media (max-width:820px){
    .rules-note .rules-text{font-size:16px;}
    .rules-note .rules-title{font-size:15px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="rules-note">
      <span class="rules-icon">⚠️</span>
      <span class="rules-title">Rules</span>
      <span class="rules-text">Jika poin sama, urutan peringkat: (1) Nama <u>Bin</u> paling atas. (2) Sesama Bin, yang <u>slot lebih awal</u> di atas. (3) Selain Bin, yang <u>slot lebih awal</u> di atas.</span>
    </div>
    <div class="tables">
      <div class="table-col">
        <div class="table-scroll">
          <table>
            <colgroup>
              <col class="col-rank"><col class="col-name"><col class="col-nick">
              <col class="col-points"><col class="col-catch"><col class="col-status"><col class="col-hist">
            </colgroup>
            <thead>
              <tr>
                <th class="center">Rank</th>
                <th class="left">Nama Peserta</th>
                <th class="left">Nama Display</th>
                <th class="center">Poin</th>
                <th class="center catch">🐟 Naik</th>
                <th class="center">Bayar</th>
                <th class="center hist">Log</th>
              </tr>
            </thead>
            <tbody id="tableBodyTop"></tbody>
          </table>
        </div>
      </div>
      <div class="table-col">
        <div class="table-scroll">
          <table>
            <colgroup>
              <col class="col-rank"><col class="col-name"><col class="col-nick">
              <col class="col-points"><col class="col-catch"><col class="col-status"><col class="col-hist">
            </colgroup>
            <thead>
              <tr>
                <th class="center">Rank</th>
                <th class="left">Nama Peserta</th>
                <th class="left">Nama Display</th>
                <th class="center">Poin</th>
                <th class="center catch">🐟 Naik</th>
                <th class="center">Bayar</th>
                <th class="center hist">Log</th>
              </tr>
            </thead>
            <tbody id="tableBodyBottom"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="histModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="histModalTitle">Riwayat Poin<small id="histModalSub"></small></div>
      <button type="button" class="modal-close" id="histModalClose">✕</button>
    </div>
    <div class="modal-body" id="histModalBody"></div>
  </div>
</div>

<script>
  const namaPeserta = [
    "","","","","","","","","","",
    "","","","","","","","","",""
  ];
  const nicknamePeserta = [
    "","","","","","","","","","",
    "","","","","","","","","",""
  ];
  const defaultTeams = [];
  for(let i=1;i<=20;i++){
    defaultTeams.push({ id:i, name:namaPeserta[i-1], nickname:nicknamePeserta[i-1], points:0, catches:0, paid:0, checked:false, slotTime:0, history:[] });
  }

  let teams = JSON.parse(JSON.stringify(defaultTeams));

  const tbodyTop = document.getElementById('tableBodyTop');
  const tbodyBottom = document.getElementById('tableBodyBottom');
  const histModal = document.getElementById('histModal');
  const histModalBody = document.getElementById('histModalBody');
  const histModalTitle = document.getElementById('histModalTitle');
  const histModalSub = document.getElementById('histModalSub');
  const histModalClose = document.getElementById('histModalClose');

  let renderTimer = null;
  let pendingFocus = null;

  function scheduleRender(delay = 550){
    if(renderTimer) clearTimeout(renderTimer);
    renderTimer = setTimeout(() => {
      renderTimer = null;
      render();
    }, delay);
  }

  // Cek apakah nama peserta mengandung kata "bin" (tidak peka huruf besar/kecil).
  // Kata utuh: "Ahmad Bin Ali" terdeteksi, "Robin" / "Sabina" tidak.
  // Ganti ke /bin/i jika ingin semua nama yang memuat "bin" ikut terdeteksi.
  function isBin(team){
    return /\bbin\b/i.test(team.name || '');
  }

  // Urutan: poin terbanyak dulu. Jika poin sama:
  // 1) peserta ber-nama "Bin" otomatis di atas (dianggap slot awal)
  // 2) selanjutnya berdasarkan nomor slot (id lebih kecil = lebih awal)
  function slotKey(t){
    return t.slotTime || Infinity;
  }

  function getSorted(){
    return [...teams].sort((a,b) => {
      if(b.points !== a.points) return b.points - a.points;
      const aBin = isBin(a), bBin = isBin(b);
      if(aBin !== bBin) return aBin ? -1 : 1;
      const ka = slotKey(a), kb = slotKey(b);
      if(ka !== kb) return ka < kb ? -1 : 1;
      return a.id - b.id;
    });
  }

  function pointsClassFor(points){
    return points === 0 ? ' zero-points' : (points > 1 ? ' high-points' : '');
  }

  function formatTime(ts){
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function openHistory(teamId){
    const t = teams.find(x => x.id === teamId);
    if(!t) return;
    const label = t.nickname || t.name || ('Peserta #' + t.id);
    histModalTitle.textContent = 'Riwayat Poin';
    histModalSub.textContent = label;
    histModalTitle.appendChild(histModalSub);

    if(!t.history.length){
      histModalBody.innerHTML = '<div class="hist-empty">Belum ada perubahan poin.</div>';
    } else {
      const summary = '<div class="hist-empty" style="padding:0 0 12px;text-align:left;color:var(--ink);font-weight:600;">Total naik: 🐟 ' + t.catches + ' kali</div>';
      const items = [...t.history].slice().reverse().map(h => {
        const sign = h.delta > 0 ? '+' : '';
        const cls = h.delta > 0 ? 'pos' : 'neg';
        return '<li class="hist-item">'
          + '<span class="hist-delta ' + cls + '">' + sign + h.delta + '</span>'
          + '<span class="hist-meta"><span class="hist-after">poin jadi ' + h.after + '</span>'
          + '<span class="hist-time">' + formatTime(h.time) + '</span></span>'
          + '</li>';
      }).join('');
      histModalBody.innerHTML = summary + '<ul class="hist-list">' + items + '</ul>';
    }
    histModal.classList.add('open');
  }

  function closeHistory(){
    histModal.classList.remove('open');
  }
  histModalClose.addEventListener('click', closeHistory);
  histModal.addEventListener('click', (e) => {
    if(e.target === histModal) closeHistory();
  });

  function buildRow(team, rank){
    const tr = document.createElement('tr');

    const tdRank = document.createElement('td');
    tdRank.className = 'rank center';
    let badgeClass = 'badge';
    if(rank === 1) badgeClass += ' gold';
    else if(rank === 2) badgeClass += ' silver';
    else if(rank === 3) badgeClass += ' bronze';
    tdRank.innerHTML = '<span class="' + badgeClass + '">' + rank + '</span>';

    const pointsClass = pointsClassFor(team.points);

    const tdCatch = document.createElement('td');
    tdCatch.className = 'center catch';
    const catchBadge = document.createElement('span');
    catchBadge.className = 'catch-badge';
    const fishIcon = document.createElement('span');
    fishIcon.className = 'fish-icon';
    fishIcon.textContent = '🐟';
    const catchBadgeCount = document.createElement('span');
    catchBadgeCount.textContent = team.catches;
    catchBadge.appendChild(fishIcon);
    catchBadge.appendChild(catchBadgeCount);
    tdCatch.appendChild(catchBadge);

    const tdName = document.createElement('td');
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'team-name' + pointsClass;
    nameInput.value = team.name;
    nameInput.placeholder = 'Nama Peserta';
    nameInput.dataset.id = team.id;
    nameInput.dataset.field = 'name';
    nameInput.addEventListener('input', (e) => {
      const t = teams.find(x => x.id === team.id);
      t.name = e.target.value;
      if(t.name.trim() === '') t.slotTime = 0;
      else if(!t.slotTime) t.slotTime = Date.now();
    });
    // Setelah selesai mengedit nama, urutan diperbarui (untuk aturan "Bin")
    nameInput.addEventListener('change', () => {
      scheduleRender();
    });
    tdName.appendChild(nameInput);

    const tdNick = document.createElement('td');
    const nickInput = document.createElement('input');
    nickInput.type = 'text';
    nickInput.className = 'team-nick' + pointsClass;
    nickInput.value = team.nickname;
    nickInput.placeholder = 'Nama Display';
    nickInput.dataset.id = team.id;
    nickInput.dataset.field = 'nick';
    nickInput.addEventListener('input', (e) => {
      const t = teams.find(x => x.id === team.id);
      t.nickname = e.target.value;
    });
    tdNick.appendChild(nickInput);

    const tdPoints = document.createElement('td');
    tdPoints.className = 'center';

    const pointsWrap = document.createElement('div');
    pointsWrap.className = 'points-wrap';

    const pointsInput = document.createElement('input');
    pointsInput.type = 'text';
    pointsInput.className = 'points' + pointsClass;
    pointsInput.value = team.points;
    pointsInput.readOnly = true;
    pointsInput.tabIndex = -1;
    pointsInput.style.cursor = 'default';
    pointsInput.dataset.id = team.id;
    pointsInput.dataset.field = 'points';

    function applyPoints(newPoints, delta){
      const t = teams.find(x => x.id === team.id);
      t.points = newPoints;
      if(delta){
        const now = Date.now();
        t.history.push({ delta: delta, after: newPoints, time: now });
        if(delta > 0){
          t.catches += 1;
          catchBadgeCount.textContent = t.catches;
        }
      }
      const cls = pointsClassFor(t.points);
      pointsInput.value = t.points;
      pointsInput.className = 'points' + cls;
      nameInput.className = 'team-name' + cls;
      nickInput.className = 'team-nick' + cls;
    }

    const addRow = document.createElement('div');
    addRow.className = 'add-row';

    const addInput = document.createElement('input');
    addInput.type = 'number';
    addInput.className = 'points-add';
    addInput.placeholder = '±';
    addInput.title = 'Ketik angka positif untuk tambah, atau minus (mis. -2) untuk kurangi poin, lalu tekan Enter atau tombol +';
    addInput.dataset.id = team.id;
    addInput.dataset.field = 'add';
    addInput.addEventListener('focus', (e) => e.target.select());

    function commitAdd(){
      const delta = parseInt(addInput.value, 10);
      if(isNaN(delta) || delta === 0){
        addInput.value = '';
        return;
      }
      const t = teams.find(x => x.id === team.id);
      const clampedNew = Math.max(0, t.points + delta);
      const actualDelta = clampedNew - t.points;
      applyPoints(clampedNew, actualDelta);
      addInput.value = '';
      pendingFocus = { id: team.id, field: 'add' };
      scheduleRender();
    }

    addInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        commitAdd();
      }
    });
    addInput.addEventListener('blur', () => {
      if(addInput.value !== '') commitAdd();
    });

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'add-btn';
    addBtn.textContent = '+';
    addBtn.title = 'Tambahkan poin';
    addBtn.addEventListener('click', () => {
      commitAdd();
    });

    addRow.appendChild(addInput);
    pointsWrap.appendChild(pointsInput);
    pointsWrap.appendChild(addRow);
    pointsWrap.appendChild(addBtn);
    tdPoints.appendChild(pointsWrap);

    const tdStatus = document.createElement('td');
    tdStatus.className = 'center';

    const payWrap = document.createElement('div');
    payWrap.className = 'pay-wrap';

    const payInput = document.createElement('input');
    payInput.type = 'text';
    payInput.inputMode = 'numeric';
    payInput.placeholder = '0';
    payInput.dataset.id = team.id;
    payInput.dataset.field = 'pay';

    const checkBtn = document.createElement('button');
    checkBtn.type = 'button';
    checkBtn.title = 'Tandai lunas';
    checkBtn.dataset.id = team.id;
    checkBtn.dataset.field = 'check';

    function refreshPayInput(){
      const t = teams.find(x => x.id === team.id);
      payInput.value = t.paid ? t.paid : '';
      payInput.className = 'pay-input ' + (t.paid > 0 ? 'paid' : 'unpaid');
      payInput.title = t.paid > 0 ? 'Sudah bayar: ' + t.paid : 'Belum bayar — masukkan jumlah bayar';
    }
    function refreshCheckBtn(){
      const t = teams.find(x => x.id === team.id);
      checkBtn.className = 'check-btn' + (t.checked ? ' checked' : '');
      checkBtn.textContent = t.checked ? '✓' : '';
      checkBtn.title = t.checked ? 'Lunas — klik untuk batalkan' : 'Tandai lunas';
    }
    refreshPayInput();
    refreshCheckBtn();

    function commitPay(){
      const raw = payInput.value.replace(/[^0-9]/g, '');
      const t = teams.find(x => x.id === team.id);
      t.paid = raw === '' ? 0 : parseInt(raw, 10);
      t.checked = t.paid > 0;
      refreshPayInput();
      refreshCheckBtn();
    }
    payInput.addEventListener('input', () => {
      payInput.value = payInput.value.replace(/[^0-9]/g, '');
    });
    payInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        commitPay();
        payInput.blur();
      }
    });
    payInput.addEventListener('blur', commitPay);

    checkBtn.addEventListener('click', () => {
      const t = teams.find(x => x.id === team.id);
      t.checked = !t.checked;
      refreshCheckBtn();
    });

    payWrap.appendChild(payInput);
    payWrap.appendChild(checkBtn);
    tdStatus.appendChild(payWrap);

    const tdHist = document.createElement('td');
    tdHist.className = 'center hist';
    const histBtn = document.createElement('button');
    histBtn.type = 'button';
    histBtn.className = 'hist-btn';
    histBtn.title = 'Lihat riwayat poin';
    histBtn.textContent = '🕘';
    if(team.history.length){
      const count = document.createElement('span');
      count.className = 'hist-count';
      count.textContent = team.history.length;
      histBtn.appendChild(count);
    }
    histBtn.addEventListener('click', () => openHistory(team.id));
    tdHist.appendChild(histBtn);

    tr.appendChild(tdRank);
    tr.appendChild(tdName);
    tr.appendChild(tdNick);
    tr.appendChild(tdPoints);
    tr.appendChild(tdCatch);
    tr.appendChild(tdStatus);
    tr.appendChild(tdHist);
    return tr;
  }

  function render(){
    const sorted = getSorted();
    tbodyTop.innerHTML = '';
    tbodyBottom.innerHTML = '';
    sorted.forEach((team, idx) => {
      const rank = idx + 1;
      const row = buildRow(team, rank);
      if(rank <= 10) tbodyTop.appendChild(row);
      else tbodyBottom.appendChild(row);
    });

    if(pendingFocus){
      const selector = '[data-id="' + pendingFocus.id + '"][data-field="' + pendingFocus.field + '"]';
      const el = document.querySelector(selector);
      if(el){
        el.focus();
        if(pendingFocus.field === 'points') el.select();
      }
      pendingFocus = null;
    }
  }

  render();
</script>
</body>
</html>
